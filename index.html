/* ---------- Nachfassen ----------
   Die Messe endet Freitag, danach faengt die Arbeit an. Wer wurde angefragt,
   wer hat geantwortet, wo haengt es. */
const DAY = 86400000;
function daysSince(ts){ return ts ? Math.floor((Date.now() - ts) / DAY) : null; }

function followState(sup){
  const ps = productsOf(sup.id);
  if(!ps.length) return null;
  const relevant = ps.filter(p => p.status === "must" || p.status === "fav");
  if(ps.some(p => p.stage === "ordered")) return { k:"done", rank:4, t:"Bestellt" };
  if(sup.repliedAt || ps.some(p => p.stage === "quoted"))
    return { k:"reply", rank:2, t:"Angebot erhalten", since: sup.repliedAt };
  if(sup.rfqSentAt)
    return { k:"wait", rank:1, t:"Wartet auf Antwort", since: sup.rfqSentAt };
  if(relevant.length) return { k:"todo", rank:0, t:"Noch nicht angefragt" };
  return { k:"idle", rank:3, t:"Nur angesehen" };
}
const FU_GROUPS = [
  { k:"todo",  t:"Noch nicht angefragt", hint:"Lieferanten mit Must Buy oder Favorit, an die noch keine Anfrage raus ist." },
  { k:"wait",  t:"Wartet auf Antwort",   hint:"Anfrage ist draußen. Nach fünf Tagen ohne Antwort lohnt ein Nachfassen." },
  { k:"reply", t:"Angebot erhalten",     hint:"Jetzt vergleichen, Muster bestellen oder verhandeln." },
  { k:"done",  t:"Bestellt",             hint:"" }
];

function viewFollowup(){
  const sups = S.suppliers.filter(s => productsOf(s.id).length);
  const withState = sups.map(s => ({ s, st: followState(s) })).filter(x => x.st && x.st.k !== "idle");
  if(!withState.length)
    return hdr("Nachfassen",{back:true})
      + empty("file","Noch nichts zum Nachfassen.",
              "Sobald du Lieferanten mit Must Buy oder Favorit hast, stehen sie hier.");

  let h = hdr("Nachfassen", {back:true});
  const pr = primer("followup",
    "Die Messe endet, dann fängt die Arbeit an. Hier steht, an wen eine Anfrage raus ist, "
    + "wer geantwortet hat und wo es hängt.",
    "");
  if(pr) h += '<div class="note-w">' + pr + '</div>';

  FU_GROUPS.forEach(g => {
    const items = withState.filter(x => x.st.k === g.k);
    if(!items.length) return;
    items.sort((a,b) => (a.st.since || 0) - (b.st.since || 0));
    h += '<div class="lbl-sec pad">' + g.t + ' · ' + items.length + '</div>';
    if(g.hint && seenCount("followup") < 3)
      h += '<div class="help pad" style="margin:-4px 0 10px">' + g.hint + '</div>';
    items.forEach(({s, st}) => {
      const d = daysSince(st.since);
      const late = g.k === "wait" && d != null && d >= 5;
      const ps = productsOf(s.id);
      const must = ps.filter(p => p.status === "must").length;
      h += '<div class="fu' + (late ? " late" : "") + '">'
        + '<div class="fh">' + ic("building")
          + '<span class="ft"><b>' + esc(s.name) + '</b><small>'
            + esc([s.hall && "Hall " + s.hall, s.booth].filter(Boolean).join(" · ") || "kein Stand")
            + ' · ' + ps.length + (ps.length === 1 ? " Produkt" : " Produkte")
            + (must ? " · " + must + " Must Buy" : "") + '</small></span>'
          + (d != null
             ? '<span class="days">' + d + '<em>' + (d === 1 ? "Tag" : "Tage") + '</em></span>'
             : "")
        + '</div>'
        + '<div class="fa">'
          + (g.k === "todo"
             ? '<a class="btn pri" href="#/rfq/' + s.id + '">' + ic("file","s") + 'Anfrage</a>'
             : "")
          + (g.k === "wait"
             ? '<button class="btn' + (late ? " pri" : "") + '" onclick="shareRfq(\'' + s.id + '\')">'
               + ic("arrow","s") + 'Nachfassen</button>'
               + '<button class="btn" onclick="markReplied(\'' + s.id + '\')">' + ic("check","s") + 'Antwort da</button>'
             : "")
          + (g.k === "reply"
             ? '<a class="btn" href="#/s/' + s.id + '">' + ic("building","s") + 'Lieferant</a>'
               + '<button class="btn" onclick="markSent(\'' + s.id + '\',1)">' + ic("arrow","s") + 'Erneut anfragen</button>'
             : "")
          + (g.k === "done" ? '<a class="btn" href="#/s/' + s.id + '">' + ic("building","s") + 'Lieferant</a>' : "")
        + '</div></div>';
    });
  });
  noteSeen("followup");
  return h + '<div style="height:20px"></div>';
}
async function markSent(id, reset){
  const s = S.suppliers.find(x => x.id === id); if(!s) return;
  s.rfqSentAt = Date.now();
  if(reset) s.repliedAt = null;
  s.updatedAt = Date.now();
  await DB.put("suppliers", s);
  toast("Als angefragt vermerkt");
  render();
}
async function markReplied(id){
  const s = S.suppliers.find(x => x.id === id); if(!s) return;
  s.repliedAt = Date.now();
  s.updatedAt = Date.now();
  await DB.put("suppliers", s);
  toast("Antwort vermerkt");
  render();
}
/* Wie viele Lieferanten warten schon zu lange? */
function overdueCount(){
  return S.suppliers.filter(s => {
    const st = followState(s);
    return st && st.k === "wait" && daysSince(st.since) >= 5;
  }).length;
}

/* ---------- Preis-Einordnung ----------
   Nach zwei Tagen kennt die App zwölf Sofas. Dann kann sie sagen, wo dieses
   eine steht — eine Zahl, die sonst niemand am Stand hat. */
function peers(p){
  if(!p.category) return [];
  return fairProducts().filter(o =>
    o.category === p.category && priceIn(o, "EUR") != null);
}
function ranking(p){
  const mine = priceIn(p, "EUR");
  if(mine == null) return null;
  const group = peers(p);
  if(group.length < 4) return null;
  const vals = group.map(o => priceIn(o, "EUR")).sort((a,b) => a - b);
  const below = vals.filter(v => v < mine).length;
  const pct = Math.round(below / (vals.length - 1) * 100);
  const cheaper = below;
  const median = vals[Math.floor(vals.length / 2)];
  const out = { n:vals.length, min:vals[0], max:vals[vals.length-1], median, mine, pct, cheaper, vals };

  /* Bei Möbeln ist der Preis je Kubikmeter die ehrlichere Zahl. */
  const withVol = group.filter(o => itemCbm(o));
  const v = itemCbm(p);
  if(v && withVol.length >= 4){
    const per = withVol.map(o => priceIn(o,"EUR") / itemCbm(o)).sort((a,b) => a - b);
    out.perCbm = { mine: mine / v, median: per[Math.floor(per.length/2)], n: per.length };
  }
  return out;
}
function rankBlock(p){
  const r = ranking(p);
  if(!r) return "";
  const span = Math.max(1, r.max - r.min);
  const pos = v => Math.max(0, Math.min(100, (v - r.min) / span * 100));
  const quart = r.pct >= 75 ? "im teuersten Viertel"
              : r.pct >= 50 ? "über dem Median"
              : r.pct >= 25 ? "unter dem Median"
              :               "im günstigsten Viertel";
  return '<div class="sec"><h3>Einordnung unter ' + r.n + ' × ' + esc(p.category) + '</h3>'
    + '<div class="rankbar"><span class="ln"></span>'
      + r.vals.map(v => '<span class="pip" style="left:' + pos(v) + '%"></span>').join("")
      + '<span class="med" style="left:' + pos(r.median) + '%"></span>'
      + '<span class="dot" style="left:' + pos(r.mine) + '%"></span>'
    + '</div>'
    + '<div class="rankscale"><span>' + money(r.min,"EUR") + '</span>'
      + '<span>Median ' + money(r.median,"EUR") + '</span>'
      + '<span>' + money(r.max,"EUR") + '</span></div>'
    + '<div class="verdictline">Liegt <b>' + quart + '</b> — teurer als '
      + r.cheaper + ' von ' + (r.n - 1) + ' vergleichbaren '
      + esc(p.category) + '.</div>'
    + (r.perCbm
       ? '<div class="calc" style="margin-top:14px">'
         + '<div class="r"><span>Preis je m³</span><b>' + money(r.perCbm.mine,"EUR") + '</b></div>'
         + '<div class="r"><span>Median je m³<em>' + r.perCbm.n + ' mit Maßen</em></span><b>'
           + money(r.perCbm.median,"EUR") + '</b></div>'
         + '</div>'
         + '<div class="help">Bei Möbeln entscheidet das Volumen über die Fracht. Der Preis je m³ '
         + 'vergleicht ehrlicher als der Stückpreis.</div>'
       : "")
    + '</div>';
}
</script>

<script>
"use strict";
/* ============================================================
   FELDER DIREKT AUSFUELLEN
   Jede Zeile der Detailseite ist ein Formular. Kein Umweg ueber
   den Bearbeiten-Bildschirm, kein Suchen nach dem richtigen Feld.
   ============================================================ */

function fsText(k, v, ph, mode){
  return '<input class="inp' + (mode ? " num" : "") + '" data-k="' + k + '" '
    + (mode ? 'inputmode="' + mode + '" ' : "")
    + 'placeholder="' + esc(ph || "") + '" value="' + esc(v == null ? "" : String(v)) + '">';
}
function fsArea(k, v, ph){
  return '<textarea class="inp" data-k="' + k + '" placeholder="' + esc(ph || "") + '">'
    + esc(v || "") + '</textarea>';
}
function fsTriple(k, o){
  return '<div class="three">' + ["l","w","h"].map(a =>
      '<input class="inp num" inputmode="decimal" data-k="' + k + "." + a + '" oninput="fsVol()" '
      + 'placeholder="' + a.toUpperCase() + '" value="' + ((o && o[a]) || "") + '">').join("")
    + '</div><div class="fsvol" id="fsvol"></div>';
}
function fsVol(){
  const el = document.getElementById("fsvol"); if(!el) return;
  const g = a => {
    const i = document.querySelector('.sheetbx [data-k$=".' + a + '"]');
    return i ? (parseFloat(String(i.value).replace(",",".")) || 0) : 0;
  };
  const v = (g("l") * g("w") * g("h")) / 1e6;
  el.textContent = v > 0 ? "Volumen " + nf(v,3) + " m³" : "Volumen — sobald alle drei Maße stehen";
}
/* Chips mit genau einer Auswahl. opts: ["A"] oder [["wert","Anzeige"]] */
function fsChips(k, opts, cur){
  const norm = opts.map(o => Array.isArray(o) ? o : [o,o]);
  return '<input type="hidden" class="fshid" data-k="' + k + '" value="' + esc(cur || "") + '">'
    + '<div class="chipset">' + norm.map(([v,t]) =>
        '<button type="button" class="' + (cur === v ? "on" : "") + '" '
        + 'onclick="fsPick(this,' + esc(JSON.stringify(v)) + ')">' + esc(t) + '</button>').join("")
    + '</div>';
}
function fsPick(btn, val){
  const box = btn.closest(".sheetbx"); if(!box) return;
  const hid = box.querySelector(".fshid"); if(!hid) return;
  const same = hid.value === val;
  hid.value = same ? "" : val;
  box.querySelectorAll(".chipset button").forEach(b => b.classList.remove("on"));
  if(!same) btn.classList.add("on");
}
/* Mehrfachauswahl. Der versteckte Wert ist eine Liste, getrennt durch \u001f. */
function fsMulti(k, opts, cur){
  const on = new Set(cur || []);
  return '<input type="hidden" class="fsmul" data-k="' + k + '" value="' + esc((cur||[]).join("\u001f")) + '">'
    + '<div class="chipset">' + opts.map(o =>
        '<button type="button" class="' + (on.has(o) ? "on" : "") + '" '
        + 'onclick="fsToggle(this,' + esc(JSON.stringify(o)) + ')">' + esc(o) + '</button>').join("")
    + '</div>';
}
function fsToggle(btn, val){
  const box = btn.closest(".sheetbx"); if(!box) return;
  const hid = box.querySelector(".fsmul"); if(!hid) return;
  const list = hid.value ? hid.value.split("\u001f") : [];
  const i = list.indexOf(val);
  if(i < 0){ list.push(val); btn.classList.add("on"); }
  else { list.splice(i,1); btn.classList.remove("on"); }
  hid.value = list.join("\u001f");
}
/* Drei Schieber mit laufender Gesamtnote. */
function fsRate(p){
  const L = {design:"Design", quality:"Qualität", price:"Preis"};
  return ["design","quality","price"].map(k =>
      '<div class="fsrate"><span class="l">' + L[k] + '</span>'
      + '<input type="range" min="0" max="10" step="1" data-k="' + k + '" oninput="fsScore()" '
      + 'value="' + ((p.rate && p.rate[k]) || 0) + '">'
      + '<span class="n" id="fsr-' + k + '">' + ((p.rate && p.rate[k] != null) ? p.rate[k] : "–") + '</span></div>').join("")
    + '<div class="fsvol" id="fsvol">Gesamt –</div>';
}
function fsScore(){
  const box = document.querySelector(".sheetbx"); if(!box) return;
  const w = S.cfg.weights, v = {};
  ["design","quality","price"].forEach(k => {
    const i = box.querySelector('[data-k="' + k + '"]');
    v[k] = i ? parseInt(i.value,10) : 0;
    const n = document.getElementById("fsr-" + k);
    if(n) n.textContent = v[k] ? v[k] : "–";
  });
  const sum = w.design + w.quality + w.price || 100;
  const tot = (v.design*w.design + v.quality*w.quality + v.price*w.price) / sum;
  const out = document.getElementById("fsvol");
  if(out) out.textContent = tot > 0 ? "Gesamt " + nf(tot,1) + " / 10" : "Gesamt –";
}
function fsNum(v){ const n = parseFloat(String(v == null ? "" : v).replace(",",".")); return isNaN(n) ? null : n; }
function checkTriple(d, k){
  let leer = 0;
  for(const a of ["l","w","h"]){
    const raw = d[k + "." + a];
    if(raw === "" || raw == null){ leer++; continue; }
    const n = fsNum(raw);
    if(n == null) return "„" + raw + "“ ist keine Zahl.";
    if(n <= 0) return "Maße müssen größer als null sein.";
    if(n > 2000) return "Über 20 Meter? Die Maße sind in Zentimetern.";
  }
  if(leer > 0 && leer < 3) return "Alle drei Maße oder keins — sonst gibt es kein Volumen.";
  return null;
}
function fsTripleApply(p, k, d){
  const o = {};
  for(const a of ["l","w","h"]){ const n = fsNum(d[k + "." + a]); if(n != null) o[a] = n; }
  p[k] = o;
}

const FIELDS = {

        + "der Unterschied macht schnell 20 % aus.",
    apply: (p,d) => fsTripleApply(p,"carton",d) },

    form: p => fsText("material", p.material, "Bouclé / Aluminium / Foam"),

      return null; },

      ["design","quality","price"].forEach(k => { const n = parseInt(d[k],10); p.rate[k] = n > 0 ? n : null; }); } },

/* Reihenfolge der Luecken: erst was den Preis vergleichbar macht,
   dann was fuer Fracht und Rueckweg gebraucht wird, dann der Rest. */
const GAP_ORDER = ["title","price","kind","supplier","booth","category","sku",
                   "carton","dims","material","moq","leadTime"];

function fieldEmpty(p, k){
  switch(k){
    case "title":    return !p.title;
    case "price":    return !p.price || p.price.amount == null;
    case "kind":     return !p.price || !p.price.kind || p.price.kind === "unbekannt";
    case "supplier": return !p.supplierId;
    case "booth":    { const s = supplierOf(p); return !s || (!s.hall && !s.booth); }
    case "carton":   return !cbm(p.carton);
    case "dims":     return !cbm(p.dims);
    case "moq":      return !p.moq;
    default:         return !p[k];
  }
}
function gapsOf(p){ return GAP_ORDER.filter(k => fieldEmpty(p, k)); }

let FILL_QUEUE = null;

async function editField(pid, key){
  const p = S.products.find(x => x.id === pid); if(!p) return;
  const f = FIELDS[key]; if(!f) return;
  if(f.need === "supplier" && !supplierOf(p)){
    toast("Zuerst den Lieferanten zuordnen.");
    return editField(pid, "supplier");
  }
  const q = FILL_QUEUE && FILL_QUEUE.pid === pid ? FILL_QUEUE : null;
  const step = q ? '<span class="step">' + (q.done + 1) + " von " + q.total + '</span>' : "";
  const more = q && q.keys.length > 1;
  const bar = q
    ? '<div class="fsbar"><i style="--from:' + (q.done / q.total).toFixed(3)
      + ';--to:' + ((q.done + 1) / q.total).toFixed(3) + '"></i></div>'
    : "";

  const pr = openSheet(bar + '<h3>' + esc(f.label) + step + '</h3>'
    + f.form(p)
    + (f.hint ? '<div class="help" style="margin:14px 0 0">' + f.hint + '</div>' : "")
    + '<div class="sheetact">'
      + '<button class="btn" onclick="closeSheet(null)">' + (q ? "Abbrechen" : "Zurück") + '</button>'
      + '<button class="btn pri" onclick="submitSheet()">' + (more ? "Weiter" : "Sichern") + '</button>'
    + '</div>');
  if(SHEET) SHEET.el.addEventListener("keydown", e => {
    if(e.key === "Enter" && e.target.tagName !== "TEXTAREA"){ e.preventDefault(); submitSheet(); }
  });
  /* Nach einer abgelehnten Eingabe steht das Getippte wieder drin. */
  if(FS_PRE && SHEET){
    const pre = FS_PRE; FS_PRE = null;
    SHEET.el.querySelectorAll("[data-k]").forEach(i => {
      if(pre[i.dataset.k] !== undefined) i.value = pre[i.dataset.k];
    });
  }
  if(key === "dims" || key === "carton") setTimeout(fsVol, 40);
  if(key === "rate") setTimeout(fsScore, 40);

  const res = await pr;
  if(!res){ if(FS_HANDOFF) FS_HANDOFF = false; else FILL_QUEUE = null; return; }

  if(f.check){
    const bad = f.check(res);
    if(bad){
      toast(bad, 3200);
      FS_PRE = res;                    /* damit die Eingabe nicht verloren geht */
      await new Promise(r => setTimeout(r, 260));
      return editField(pid, key);
    }
  }
  await f.apply(p, res);
  p.updatedAt = Date.now();
  await DB.put("products", p);
  await loadAll();
  render();
  flashRow(key);
  const gb = document.querySelector(".gapbtn");
  if(gb){ gb.classList.add("drop"); setTimeout(() => gb.classList.remove("drop"), 560); }

  if(q){
    q.keys.shift(); q.done++;
    if(q.keys.length){ return editField(pid, q.keys[0]); }
    FILL_QUEUE = null;
    toast(gapsOf(p).length ? "Fertig für jetzt." : "Vollständig.");
  }
}

async function fsNewSupplier(){
  FS_HANDOFF = true;                 /* uebergibt an das naechste Sheet, bricht nicht ab */
  closeSheet(null);
  await new Promise(r => setTimeout(r, 260));
  const r = await askForm("Neuer Lieferant", [
    {k:"name",  label:"Firmenname",   placeholder:"Shanghai Hengtai Furniture"},
    {k:"hall",  label:"Halle",        placeholder:"5.1"},
    {k:"booth", label:"Standnummer",  placeholder:"B17"}
  ], "Anlegen");
  if(!r || (!r.name && !r.booth)){ FILL_QUEUE = null; return; }
  const s = { id:uid(), fairId:S.cfg.activeFair, name:r.name || ("Stand " + r.booth),
              hall:r.hall, booth:r.booth, contact:"", wechat:"", phone:"", email:"",
              website:"", city:"", note:"", checks:[], rating:null,
              createdAt:Date.now(), updatedAt:Date.now() };
  await DB.put("suppliers", s);
  const pid = FS_TARGET;
  const p = S.products.find(x => x.id === pid);
  if(p){ p.supplierId = s.id; p.updatedAt = Date.now(); await DB.put("products", p); }
  await loadAll();
  render();
  flashRow("supplier");
  toast("Lieferant angelegt.");
  const q = FILL_QUEUE && FILL_QUEUE.pid === pid ? FILL_QUEUE : null;
  if(q){
    while(q.keys.length && !fieldEmpty(p, q.keys[0])){ q.keys.shift(); q.done++; }
    if(q.keys.length) return editField(pid, q.keys[0]);
    FILL_QUEUE = null;
  }
}

let FS_TARGET = null, FS_HANDOFF = false, FS_PRE = null;
function openField(pid, key){ FS_TARGET = pid; FILL_QUEUE = null; return editField(pid, key); }
function fillAll(pid){
  const p = S.products.find(x => x.id === pid); if(!p) return;
  const keys = gapsOf(p);
  if(!keys.length){ toast("Es fehlt nichts mehr."); return; }
  FS_TARGET = pid;
  FILL_QUEUE = { pid, keys, total:keys.length, done:0 };
  return editField(pid, keys[0]);
}
function flashRow(key){
  const el = document.querySelector('[data-f="' + key + '"]');
  if(!el) return;
  el.classList.remove("lit");
  void el.offsetWidth;
  el.classList.add("lit");
  setTimeout(() => el.classList.remove("lit"), 1200);
}

/* Eine Zeile der Datenliste. val==null heisst: Luecke. */
function srow(p, key, label, val){
  const gap = val == null || val === "";
  return '<button class="sprow' + (gap ? " gap" : "") + '" data-f="' + key + '" '
    + 'onclick="openField(\'' + p.id + '\',\'' + key + '\')">'
    + '<span class="k">' + esc(label) + '</span>'
    + '<span class="v">' + (gap ? "Eintragen" : val) + '</span>'
    + ic(gap ? "plus" : "chev", "chev") + '</button>';
}
function srowRO(label, val){
  return '<div class="sprow ro"><span class="k">' + esc(label) + '</span>'
    + '<span class="v">' + val + '</span></div>';
}
</script>

<script>
"use strict";
/* ============================================================
   ZURUECKWISCHEN
   Auf einem 6,9-Zoll-Telefon liegt der Zurueck-Pfeil oben links
   ausserhalb dessen, was ein Daumen erreicht. Ein Zug vom linken
   Rand tut dasselbe — mit sichtbarer Rueckmeldung, damit man
   merkt, dass die Geste greift.
   ============================================================ */
(function(){
  const EDGE = 28;      /* wie weit vom Rand die Geste starten darf */
  const OPEN = 78;      /* ab hier wird zurueckgegangen */
  const SLOPE = 1.1;    /* horizontal muss deutlicher sein als vertikal */
  let x0 = 0, y0 = 0, on = false, live = false, id = null;

  const blocked = t => !t || !!(t.closest &&
    t.closest(".scroller,.recent,.cmpwrap,.chipset,.sheetbg,.viewer,input,textarea,select,[data-noswipe]"));

  function reset(anim){
    if(live){
      app.style.transition = anim ? "transform 220ms var(--e), opacity 220ms var(--e)" : "";
      app.style.transform = "";
      app.style.opacity = "";
      setTimeout(() => { app.style.transition = ""; }, anim ? 240 : 0);
    }
    on = false; live = false; id = null;
  }

  addEventListener("touchstart", e => {
    if(e.touches.length !== 1) return;
    const t = e.touches[0];
    if(t.clientX > EDGE) return;
    if(route() === "/" || route() === "") return;      /* von der Startseite fuehrt kein Zurueck */
    if(document.querySelector(".sheetbg,.viewer")) return;
    if(blocked(e.target)) return;
    x0 = t.clientX; y0 = t.clientY; on = true; live = false; id = t.identifier;
  }, {passive:true});

  addEventListener("touchmove", e => {
    if(!on) return;
    const t = Array.from(e.touches).find(x => x.identifier === id);
    if(!t) return;
    const dx = t.clientX - x0, dy = t.clientY - y0;
    if(!live){
      if(Math.abs(dy) > 26 && Math.abs(dy) > Math.abs(dx)){ on = false; return; }
      if(dx < 12) return;
      if(Math.abs(dx) < Math.abs(dy) * SLOPE) return;
      live = true;
      app.style.transition = "none";
    }
    /* Der Zug bremst sich ein — die Seite folgt gedaempft, nicht eins zu eins. */
    const p = Math.min(1, dx / 200);
    app.style.transform = "translate3d(" + (dx * 0.34).toFixed(1) + "px,0,0)";
    app.style.opacity = (1 - p * 0.22).toFixed(3);
  }, {passive:true});

  function end(e){
    if(!on) return;
    const t = Array.from(e.changedTouches || []).find(x => x.identifier === id);
    const dx = t ? t.clientX - x0 : 0;
    const go = live && dx >= OPEN;
    reset(true);
    if(go) history.back();
  }
  addEventListener("touchend", end, {passive:true});
  addEventListener("touchcancel", () => reset(true), {passive:true});
})();
</script>

<script>
"use strict";
/* ============================================================
   FEHLERNETZ
   Auf einer Messe ist ein stiller Fehler das Schlimmste: man tippt
   weiter und merkt erst abends im Hotel, dass nichts angekommen ist.
   Alles, was sonst nur in der Konsole landet, wird hier sichtbar —
   einmal, ruhig, ohne die Arbeit zu unterbrechen.
   ============================================================ */
(function(){
  let last = "", lastAt = 0, count = 0;

  function report(what, err){
    const full = err ? [err.name, err.message].filter(Boolean).join(" ") || String(err) : "Unbekannt";
    const msg = (err && err.message ? String(err.message) : full).slice(0,120);
    const now = Date.now();
    /* Derselbe Fehler in Folge wird nicht mehrfach gemeldet. */
    if(msg === last && now - lastAt < 8000) return;
    last = msg; lastAt = now; count++;
    /* Voller Speicher ist der eine Fall, der eine echte Handlung braucht. */
    if(/quota|storage|full/i.test(full)){
      if(typeof toastAction === "function")
        toastAction("Speicher voll — nichts wird mehr gesichert", "Platz schaffen",
                    () => go("/backup"), 9000);
      return;
    }
    if(typeof toast === "function") toast(what + ": " + msg, 5000);
    try{
      const box = JSON.parse(localStorage.getItem("source-errors") || "[]");
      box.push({t:now, what, msg});
      localStorage.setItem("source-errors", JSON.stringify(box.slice(-25)));
    }catch(e){ /* auch das darf nichts kaputtmachen */ }
  }

  addEventListener("error", e => {
    if(e && e.target && e.target !== window) return;   /* fehlende Bilder gehen uns nichts an */
    report("Fehler", e && e.error ? e.error : (e && e.message));
  });
  addEventListener("unhandledrejection", e => report("Fehler", e && e.reason));
  window.reportError2 = report;

  /* Fehlerprotokoll fuer den Fall, dass etwas wiederholt schiefgeht. */
  window.errorLog = function(){
    try{ return JSON.parse(localStorage.getItem("source-errors") || "[]"); }
    catch(e){ return []; }
  };
  window.clearErrorLog = function(){
    try{ localStorage.removeItem("source-errors"); }catch(e){}
  };
})();
</script>
