<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>SOURCE</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SOURCE">
<meta name="theme-color" content="#0A0A09">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
</head>
<body>
<style>
:root{
  /* Warme, fast monochrome Basis. Farbe nur dort, wo sie Bedeutung trägt. */
  --bg:#0A0A09; --s1:#131312; --s2:#1A1A18; --s3:#232220;
  --ln:#201F1D; --ln2:#2D2B28;
  --ink:#F3F1ED; --ink2:#A8A39C; --ink3:#7C776F;
  --gold:#C2A15B; --rose:#C58278; --sky:#7F9AAE; --red:#BE6A5E;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --kb:0px;   /* Höhe der eingeblendeten Tastatur, per JS gesetzt */
  --nav:58px;
  --e:cubic-bezier(.22,.72,.2,1);
  --d:260ms;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-feature-settings:"kern" 1,"liga" 1;
  letter-spacing:-.006em;
  overscroll-behavior-y:none;-webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;
}
input,select,textarea,button{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:none;padding:0;cursor:pointer;text-align:left}
a{color:inherit;text-decoration:none}
.mono{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.015em}
.hide{display:none!important}
::selection{background:var(--ink);color:var(--bg)}

/* ---------- Icons ---------- */
svg.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;
  stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;display:block}
svg.ic.s{width:16px;height:16px;stroke-width:1.6}
svg.ic.l{width:26px;height:26px;stroke-width:1.3}
svg.ic.xl{width:34px;height:34px;stroke-width:1}
svg.ic .f{fill:currentColor;stroke:none}

/* ---------- Rahmen ---------- */
#app{overflow-wrap:anywhere;min-height:100%;padding:calc(var(--sat) + 4px) var(--sar) calc(var(--nav) + var(--sab) + 20px) var(--sal)}
.pad{padding:0 20px}
.num,.bigprice,input,textarea,select,.sprow .v,.conv,.rateline{overflow-wrap:normal}
@keyframes rise{from{opacity:0;transform:translate3d(0,7px,0)}to{opacity:1;transform:none}}
#app.enter>*{animation:rise var(--d) var(--e) both}
#app.enter>*:nth-child(2){animation-delay:35ms}
#app.enter>*:nth-child(3){animation-delay:65ms}
#app.enter>*:nth-child(4){animation-delay:90ms}
#app.enter>*:nth-child(n+5){animation-delay:110ms}
@keyframes rise-s{from{opacity:0;transform:translate3d(0,4px,0)}to{opacity:1;transform:none}}
.stagger>*{animation:rise-s 300ms var(--e) both}
.stagger>*:nth-child(1){animation-delay:20ms}  .stagger>*:nth-child(2){animation-delay:45ms}
.stagger>*:nth-child(3){animation-delay:70ms}  .stagger>*:nth-child(4){animation-delay:95ms}
.stagger>*:nth-child(5){animation-delay:118ms} .stagger>*:nth-child(6){animation-delay:140ms}
.stagger>*:nth-child(7){animation-delay:160ms} .stagger>*:nth-child(8){animation-delay:178ms}
.stagger>*:nth-child(n+9){animation-delay:195ms}

/* ---------- Kopfzeile ---------- */
.topbar{display:flex;align-items:center;gap:14px;padding:10px 20px 16px;min-height:46px}
.topbar h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.022em;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{width:32px;height:32px;margin-left:-7px;display:grid;place-items:center;border-radius:9px;
  color:var(--ink2);flex:none;transition:background 160ms var(--e),color 160ms var(--e)}
.back:active{background:var(--s2);color:var(--ink)}
.tb-act{font-size:14px;color:var(--ink2);font-weight:500;flex:none;padding:7px 0;
  transition:color 160ms var(--e)}
.tb-act:active{color:var(--ink)}
.tb-act.danger{color:var(--ink3)}
.tb-act.danger:active{color:var(--red)}

/* ---------- Bottom-Navigation ---------- */
#nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + var(--sab));
  padding:0 var(--sar) var(--sab) var(--sal);background:rgba(10,10,9,.82);
  transform:translateY(0);transition:transform 200ms var(--e);will-change:transform;
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--ln);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));z-index:40}
#nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--ink3);font-size:9.5px;letter-spacing:.02em;height:var(--nav);position:relative;
  transition:color 200ms var(--e)}
#nav a.on{color:var(--ink)}
#nav a:active{opacity:.6}
#nav .badge{position:absolute;top:9px;left:50%;margin-left:5px;background:var(--gold);color:#171206;
  font-size:9px;font-weight:700;border-radius:8px;padding:1px 4.5px;min-width:15px;text-align:center;
  letter-spacing:0;line-height:1.4}
#navbar{position:absolute;top:-1px;height:1.5px;background:var(--ink);border-radius:2px;
  transition:transform 380ms var(--e),width 380ms var(--e);pointer-events:none}

/* ---------- Start ---------- */
.brand{font-size:15px;font-weight:600;letter-spacing:.34em;margin:8px 0 0;color:var(--ink)}
.brandsub{color:var(--ink3);font-size:12.5px;line-height:1.55;margin:6px 0 30px;letter-spacing:0}
.hero{padding:0 0 26px;margin-bottom:22px;border-bottom:1px solid var(--ln)}
.hero .lbl{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);margin-bottom:10px}
.hero .big{font-size:38px;font-weight:600;letter-spacing:-.035em;line-height:1;color:var(--ink)}
.hero .sub{font-size:13px;color:var(--ink2);margin-top:9px;letter-spacing:-.005em}
.cta{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;background:var(--ink);
  color:var(--bg);border-radius:13px;padding:16px;font-size:15.5px;font-weight:600;letter-spacing:-.012em;
  margin-bottom:26px;transition:transform 140ms var(--e),opacity 140ms var(--e)}
.cta:active{transform:scale(.982);opacity:.9}
.cta svg.ic{stroke-width:1.8}
.cta.ghost{background:var(--s2);color:var(--ink);font-weight:500;border:1px solid var(--ln2)}

.rows{border-top:1px solid var(--ln)}
.row{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--ln);
  color:var(--ink);width:100%;transition:opacity 140ms var(--e),transform 140ms var(--e)}
.row:active{opacity:.55;transform:scale(.995)}
.row>svg.ic{color:var(--ink2)}
.row .t{flex:1;font-size:14.5px;min-width:0;letter-spacing:-.008em}
.row .t small{display:block;color:var(--ink3);font-size:11.5px;margin-top:3px;letter-spacing:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.wrap .t small{white-space:normal;overflow:visible;line-height:1.5;margin-top:4px}
.row .v{color:var(--ink2);font-size:14px;font-variant-numeric:tabular-nums}
.row .chev{color:var(--ink3);display:flex}
.row img.av{width:36px;height:36px;border-radius:8px;object-fit:cover;flex:none;background:var(--s2)}
.lbl-sec{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);margin:34px 0 10px}

/* ---------- Produktraster ---------- */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px;padding:2px 20px 0}
.card{position:relative;transition:transform 160ms var(--e)}
.card:active{transform:scale(.984)}
.card .phw{position:relative;border-radius:11px;overflow:hidden;background:var(--s2);aspect-ratio:1/1;display:block}
.card .ph{width:100%;height:100%;object-fit:cover;display:block}
.card .ph.empty{display:grid;place-items:center;color:var(--ink3)}
.card .meta{padding:10px 1px 0}
.card .nm{font-size:13px;font-weight:500;line-height:1.35;letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.card .pr{font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:3px;letter-spacing:-.012em}
.card .pr small{color:var(--ink3);font-size:11.5px;margin-left:5px}
.card .bo{font-size:11px;color:var(--ink3);margin-top:3px;letter-spacing:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .st{position:absolute;top:8px;left:8px;display:flex;width:22px;height:22px;border-radius:50%;
  align-items:center;justify-content:center;background:rgba(10,10,9,.55);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.card .sel{position:absolute;top:7px;right:7px;width:23px;height:23px;border-radius:50%;
  background:rgba(10,10,9,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border:1px solid rgba(243,241,237,.35);display:grid;place-items:center;color:#fff;
  transition:background 180ms var(--e),border-color 180ms var(--e),transform 180ms var(--e)}
.card .sel.on{background:var(--ink);border-color:var(--ink);color:var(--bg);transform:scale(1.06)}

/* ---------- Filter ---------- */
.filters{display:flex;gap:7px;overflow-x:auto;padding:0 20px 16px;-webkit-overflow-scrolling:touch;
  scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;max-width:78vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  background:transparent;border:1px solid var(--ln2);border-radius:100px;
  padding:7px 14px;font-size:12.5px;color:var(--ink2);white-space:nowrap;letter-spacing:-.005em;
  display:flex;align-items:center;gap:6px;
  transition:background 180ms var(--e),color 180ms var(--e),border-color 180ms var(--e)}
.fchip.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:500}
.fchip:active{opacity:.7}
.searchw{position:relative;margin-bottom:16px}
.searchw svg.ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.search{width:100%;background:var(--s1);border:1px solid var(--ln);border-radius:11px;
  padding:12px 12px 12px 41px;color:var(--ink);font-size:15px;transition:border-color 180ms var(--e)}
.search::placeholder{color:var(--ink3)}
.search:focus{outline:none;border-color:var(--ln2)}

/* ---------- Formulare ---------- */
.field{margin-bottom:20px}
.field>label{display:block;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink3);margin-bottom:9px}
.inp{width:100%;background:var(--s1);border:1px solid var(--ln);border-radius:11px;
  padding:13px;color:var(--ink);font-size:16px;letter-spacing:-.01em;
  transition:border-color 180ms var(--e),background 180ms var(--e)}
.inp:focus{outline:none;border-color:var(--ln2);background:var(--s2)}
.inp::placeholder{color:var(--ink3)}
textarea.inp{min-height:88px;resize:vertical;line-height:1.55;font-size:15px}
select.inp{appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);
  background-position:calc(100% - 19px) 21px,calc(100% - 14px) 21px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:38px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.chipset{display:flex;flex-wrap:wrap;gap:7px}
.chipset button{background:transparent;border:1px solid var(--ln2);border-radius:9px;
  padding:9px 13px;font-size:13.5px;color:var(--ink2);letter-spacing:-.006em;
  display:flex;align-items:center;gap:7px;
  transition:background 180ms var(--e),color 180ms var(--e),border-color 180ms var(--e),transform 140ms var(--e)}
.chipset button:active{transform:scale(.97)}
.chipset.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.chipset.grid2 button{justify-content:center}
.chipset.grid2 button:nth-child(3):last-child{grid-column:1/-1}
.grouplbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);
  margin:26px 0 11px;font-weight:500}
.grouplbl.first{margin-top:4px}
.chipset button.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:500}
.chipset.stat button.on[data-v="must"]{background:var(--gold);border-color:var(--gold);color:#171206}
.chipset.stat button.on[data-v="fav"]{background:var(--rose);border-color:var(--rose);color:#1f0f0c}
.chipset.stat button.on[data-v="maybe"]{background:var(--sky);border-color:var(--sky);color:#0b1319}
.chipset.stat button.on[data-v="no"]{background:var(--red);border-color:var(--red);color:#1f0d0a}
.help{font-size:11.5px;color:var(--ink3);margin-top:9px;line-height:1.55;letter-spacing:0}
.help b{color:var(--ink2);font-weight:500}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:26px;width:100%}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--ln2);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;
  background:var(--ink);margin-top:-9px;transition:transform 140ms var(--e)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}
input[type=range]::-moz-range-track{height:2px;background:var(--ln2)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border:none;border-radius:50%;background:var(--ink)}

/* ---------- Preisblock ---------- */
.pricebox{position:relative;display:block;width:100%;text-align:left;font:inherit;color:var(--ink);
  background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:17px;margin-bottom:20px;
  -webkit-tap-highlight-color:transparent;transition:border-color 160ms var(--e),background 160ms var(--e)}
.pricebox:active{background:var(--s2);border-color:var(--ln2)}
.pricebox.gap .bigprice{color:var(--ink3);font-size:20px;letter-spacing:-.02em}
.pricebox.lit{animation:boxflash 1100ms var(--e)}
@keyframes boxflash{0%{border-color:var(--ln)}20%{border-color:rgba(198,164,94,.55)}100%{border-color:var(--ln)}}
.suplink{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink2);
  padding:11px 0;-webkit-tap-highlight-color:transparent}
.suplink svg.ic:first-child{color:var(--ink3)}
.suplink .chev{margin-left:auto;color:var(--ink3);opacity:.42}
.suplink:active{color:var(--ink)}
.pricebox .conv{display:flex;gap:20px;margin-top:12px;font-size:14px;color:var(--ink3);
  font-variant-numeric:tabular-nums}
.pricebox .conv b{color:var(--ink2);font-weight:500}
.rateline{font-size:11px;color:var(--ink3);margin-top:12px;letter-spacing:0;
  padding-top:12px;border-top:1px solid var(--ln)}
.rateline.old{color:var(--gold)}
.bigprice{font-size:30px;font-weight:600;letter-spacing:-.032em;font-variant-numeric:tabular-nums}

/* ---------- Fotos ---------- */
img[data-ph]{opacity:0}
img.phload{opacity:1;transition:opacity 420ms var(--e)}
.photostrip{display:flex;gap:9px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.photostrip::-webkit-scrollbar{display:none}
.photostrip img{width:78px;height:78px;object-fit:cover;border-radius:10px;flex:none;background:var(--s2)}
.photostrip .addph{width:78px;height:78px;border-radius:10px;flex:none;border:1px dashed var(--ln2);
  display:grid;place-items:center;color:var(--ink3);background:transparent;
  transition:border-color 180ms var(--e),color 180ms var(--e)}
.photostrip .addph:active{border-color:var(--ink3);color:var(--ink2)}
.gal{position:relative;background:var(--s1)}
.gal .scroller{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal .scroller::-webkit-scrollbar{display:none}
.gal .scroller img{width:100%;flex:none;scroll-snap-align:center;aspect-ratio:4/3;object-fit:cover;
  max-height:min(56vh,430px)}
.gal .count{position:absolute;right:12px;bottom:12px;background:rgba(10,10,9,.6);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-radius:100px;padding:4px 11px;font-size:11px;color:var(--ink);letter-spacing:.02em}

/* ---------- Detail ---------- */
.spec{display:block;margin:0;font-size:14px}
.sprow{position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;
  width:100%;padding:12px 0;border:0;border-bottom:1px solid var(--ln);background:none;
  color:var(--ink);font:inherit;text-align:left;-webkit-tap-highlight-color:transparent}
.sprow:last-child{border-bottom:none}
.sprow::before{content:"";position:absolute;inset:1px -10px;border-radius:9px;background:var(--s1);
  opacity:0;transition:opacity 130ms var(--e);pointer-events:none}
.sprow:active::before{opacity:1}
.sprow .k{color:var(--ink3);font-size:13px;white-space:nowrap;letter-spacing:0}
.sprow .v{text-align:right;letter-spacing:-.008em;font-variant-numeric:tabular-nums;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sprow .chev{color:var(--ink3);opacity:.42;flex:none;
  transition:transform 160ms var(--e),opacity 160ms var(--e)}
.sprow:active .chev{transform:translateX(2px);opacity:.9}
.sprow.gap .v{color:var(--ink3);font-size:12.5px;letter-spacing:0}
.sprow.gap .chev{opacity:.5}
.sprow.gap:active .chev{transform:none;opacity:1}
.sprow.ro{grid-template-columns:auto 1fr}
.sprow.ro::before{display:none}
.sprow.lit::after{content:"";position:absolute;inset:1px -10px;border-radius:9px;
  background:var(--gold);opacity:0;animation:cellflash 1100ms var(--e);pointer-events:none}
@keyframes cellflash{0%{opacity:0}18%{opacity:.13}100%{opacity:0}}
#app.enter .spec>*{animation:rise-s 260ms var(--e) both}
#app.enter .spec>*:nth-child(1){animation-delay:120ms}
#app.enter .spec>*:nth-child(2){animation-delay:134ms}
#app.enter .spec>*:nth-child(3){animation-delay:148ms}
#app.enter .spec>*:nth-child(4){animation-delay:162ms}
#app.enter .spec>*:nth-child(5){animation-delay:174ms}
#app.enter .spec>*:nth-child(6){animation-delay:186ms}
#app.enter .spec>*:nth-child(7){animation-delay:196ms}
#app.enter .spec>*:nth-child(n+8){animation-delay:206ms}
/* Die Zahl im Luecken-Hinweis zuckt, wenn sie kleiner wird. */
.gapbtn.drop{animation:gapdrop 520ms var(--e)}
@keyframes gapdrop{0%{transform:scale(1)}22%{transform:scale(.975)}100%{transform:scale(1)}}
.score{display:flex;align-items:baseline;gap:9px;margin-top:2px}
.score .n{font-size:36px;font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.score .o{color:var(--ink3);font-size:13px}
.bars{margin-top:16px;display:flex;flex-direction:column;gap:11px}
.bar{display:grid;grid-template-columns:62px 1fr 22px;gap:12px;align-items:center;font-size:12.5px;color:var(--ink3)}
.bar .tr{height:2px;background:var(--ln2);border-radius:2px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--ink2);border-radius:2px;
  transform-origin:left;animation:grow 620ms var(--e) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bar .vv{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.sec{background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:17px;margin:0 20px 14px}
.sec h3{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);margin:0 0 14px;font-weight:500}
.tagrow{display:flex;flex-wrap:wrap;gap:7px;min-width:0}
.tag{border:1px solid var(--ln2);border-radius:100px;padding:5px 11px;font-size:11.5px;
  color:var(--ink2);letter-spacing:0;max-width:100%;overflow-wrap:anywhere}
.statline{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:13px 0;
  border-top:1px solid var(--ln);border-bottom:1px solid var(--ln);margin:0 0 20px}
.statline .dot{width:7px;height:7px;border-radius:50%;flex:none}

/* ---------- Inbox ---------- */
.grp{margin:0 20px 14px;background:var(--s1);border:1px solid var(--ln);border-radius:14px;overflow:hidden}
.grp .gh{padding:14px 16px;display:flex;align-items:flex-start;gap:12px}
.grp .gh>svg.ic{color:var(--ink3);margin-top:1px}
.grp .gh .tt{flex:1;font-size:13.5px;font-weight:500;min-width:0}
.grp .gh .tt small{display:block;font-weight:400;color:var(--ink3);font-size:11.5px;margin-top:4px;
  letter-spacing:0;line-height:1.5}
.grp .thumbs{display:flex;gap:7px;padding:0 16px 14px;overflow-x:auto;scrollbar-width:none}
.grp .thumbs::-webkit-scrollbar{display:none}
.grp .thumbs img,.grp .thumbs .ghost{width:56px;height:56px;object-fit:cover;border-radius:8px;flex:none;background:var(--s2)}
.grp .thumbs .ghost{display:grid;place-items:center;color:var(--ink3)}
.grp .ga{display:flex;gap:9px;padding:0 16px 16px}
.btn{background:var(--s2);border:1px solid var(--ln2);border-radius:10px;padding:11px 15px;
  font-size:13.5px;font-weight:500;color:var(--ink);text-align:center;flex:1;letter-spacing:-.008em;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform 140ms var(--e),opacity 140ms var(--e)}
.btn:active{transform:scale(.978);opacity:.85}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.btn.sm{padding:10px 13px;font-size:12.5px;flex:none}
.btn.dgr{color:var(--red);border-color:var(--ln2);background:transparent}

/* ---------- Vergleich ---------- */
.cmpwrap{overflow-x:auto;margin:0 20px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cmpwrap::-webkit-scrollbar{display:none}
table.cmp{border-collapse:collapse;font-size:13px;width:100%}
table.cmp th,table.cmp td{padding:11px 12px;border-bottom:1px solid var(--ln);text-align:center;
  white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:-.008em}
table.cmp th:first-child,table.cmp td:first-child{text-align:left;color:var(--ink3);font-weight:400;
  position:sticky;left:0;background:var(--bg);font-size:12px;padding-left:0;letter-spacing:0}
table.cmp thead th{font-size:12px;font-weight:500;color:var(--ink);vertical-align:bottom;padding-bottom:12px}
table.cmp thead th img{width:58px;height:58px;object-fit:cover;border-radius:9px;display:block;margin:0 auto 8px;background:var(--s2)}
table.cmp td.win{color:var(--ink);font-weight:600}
.verdict{margin:22px 20px 0;border-top:1px solid var(--ln)}
.verdict div{display:flex;justify-content:space-between;align-items:baseline;gap:8px 14px;flex-wrap:wrap;
  padding:13px 0;border-bottom:1px solid var(--ln);font-size:14px}
.verdict span{color:var(--ink3);font-size:12px;letter-spacing:.06em;text-transform:uppercase;flex:none}
.verdict b{font-weight:500;text-align:right;min-width:0;overflow-wrap:anywhere;letter-spacing:-.01em}
.verdict b em{font-style:normal;color:var(--ink3);font-size:12px;margin-left:7px;font-variant-numeric:tabular-nums}

/* ---------- Diverses ---------- */
.empty{text-align:center;padding:72px 32px;color:var(--ink3)}
.empty svg.ic{margin:0 auto 18px;color:var(--ln2)}
.empty p{font-size:14px;line-height:1.65;margin:0 0 6px;color:var(--ink2)}
.empty p.q{font-size:12.5px;color:var(--ink3)}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px) scale(.97)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + var(--sab) + var(--kb) + 18px);
  background:var(--s3);color:var(--ink);padding:12px 19px;border-radius:100px;font-size:13.5px;
  z-index:90;box-shadow:0 10px 34px rgba(0,0,0,.55);max-width:86vw;text-align:center;
  border:1px solid var(--ln2);letter-spacing:-.008em;animation:toastin 300ms var(--e) both}
.toast.out{animation:toastin 200ms var(--e) reverse both}

/* Sheet statt System-Dialog */
@keyframes sheetin{from{transform:translateY(100%)}55%{transform:translateY(-4px)}to{transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.sheetbg{position:fixed;inset:0;background:rgba(4,4,4,.62);z-index:60;display:flex;align-items:flex-end;
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fadein 220ms var(--e) both}
.sheetbg.out{animation:fadein 180ms var(--e) reverse both}
.sheetbx{background:var(--s1);width:100%;border-radius:20px 20px 0 0;
  padding:10px calc(var(--sar) + 20px) calc(22px + var(--sab)) calc(var(--sal) + 20px);
  max-height:min(88vh,720px);overflow-y:auto;overscroll-behavior:contain;
  border-top:1px solid var(--ln2);animation:sheetin 320ms var(--e) both}
.sheetbg.out .sheetbx{animation:sheetin 220ms var(--e) reverse both}
.sheetbx .grab{width:34px;height:4px;border-radius:2px;background:var(--ln2);margin:0 auto 18px}
.fsbar{height:2px;border-radius:1px;background:var(--ln);margin:0 0 18px;overflow:hidden}
.fsbar i{display:block;height:100%;background:var(--gold);border-radius:1px;
  transform-origin:left;animation:fsgrow 420ms var(--e) both}
@keyframes fsgrow{from{transform:scaleX(var(--from,0))}to{transform:scaleX(var(--to,1))}}
.sheetbx h3{margin:0 0 18px;font-size:17px;font-weight:600;letter-spacing:-.02em}
.sheetbx h3 .step{float:right;font-size:12px;font-weight:500;color:var(--ink3);
  letter-spacing:0;padding-top:3px;font-variant-numeric:tabular-nums}
.sheetact{display:flex;gap:9px;margin-top:22px}
.sheetact .btn{flex:1}
.fsvol{font-size:12.5px;color:var(--ink3);margin-top:10px;font-variant-numeric:tabular-nums}
.fsrate{display:grid;grid-template-columns:66px 1fr 26px;gap:13px;align-items:center;margin-bottom:9px}
.fsrate .l{font-size:13px;color:var(--ink2)}
.fsrate .n{text-align:right;font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink)}
/* Galerie: leer und nachschieben */
.galempty{display:flex;align-items:center;justify-content:center;gap:11px;
  width:100%;height:86px;background:var(--s1);border:0;border-bottom:1px solid var(--ln);
  color:var(--ink3);font:inherit;font-size:13px;-webkit-tap-highlight-color:transparent;
  transition:background 160ms var(--e)}
.galempty:active{background:var(--s2)}
.galempty svg.ic{width:22px;height:22px;opacity:.7}
.gal .galadd{flex:none;width:34%;aspect-ratio:4/3;scroll-snap-align:center;background:var(--s2);
  border:0;border-left:1px solid var(--ln);color:var(--ink3);font:inherit;font-size:11.5px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  -webkit-tap-highlight-color:transparent;transition:color 160ms var(--e)}
.gal .galadd:active{color:var(--ink2)}
/* Tags, Bewertung, Notiz als Flaeche */
.tagline{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:11px 0;
  background:none;border:0;font:inherit;color:var(--ink);text-align:left;
  -webkit-tap-highlight-color:transparent}
.tagline::before{content:"";position:absolute;inset:1px -10px;border-radius:9px;background:var(--s1);
  opacity:0;transition:opacity 130ms var(--e);pointer-events:none}
.tagline:active::before{opacity:1}
.tagline .tagrow{display:flex;flex-wrap:wrap;gap:7px;flex:1}
.tagline .ph{flex:1;font-size:13px;color:var(--ink3)}
.tagline .chev{color:var(--ink3);opacity:.42;flex:none}
.ratebox,.notebox{position:relative;display:block;width:100%;text-align:left;font:inherit;
  color:var(--ink);background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
.ratebox .score .chev,.notebox .chev{color:var(--ink3);opacity:.42;margin-left:auto;flex:none}
.ratebox .score{display:flex;align-items:center;gap:9px}
.ratebox .score.gap .o{font-size:13.5px;color:var(--ink3)}
.ratebox:active,.notebox:active{opacity:.62}
.notebox{display:flex;align-items:flex-start;gap:12px}
.notebox .tx{flex:1;min-width:0;font-size:14px;line-height:1.6;white-space:pre-wrap;
  overflow-wrap:anywhere}
.notebox.gap .tx{color:var(--ink3);font-size:13px}
.notebox .chev{margin-top:3px}
.gapbtn{display:grid;grid-template-columns:auto 1fr;gap:4px 11px;width:100%;text-align:left;font:inherit;
  padding:14px 15px 13px;border-radius:13px;border:1px solid rgba(198,164,94,.3);
  background:rgba(198,164,94,.06);color:var(--gold);margin:0 0 20px;
  -webkit-tap-highlight-color:transparent;transition:background 140ms var(--e),border-color 140ms var(--e)}
.gapbtn:active{background:rgba(198,164,94,.14);border-color:rgba(198,164,94,.5)}
.gapbtn>svg.ic{margin-top:1px;opacity:.9}
.gapbtn .t{font-size:13px;line-height:1.5;color:var(--ink3);letter-spacing:0}
.gapbtn .t b{display:inline-block;margin-bottom:1px;color:var(--gold);font-size:13.5px;
  font-weight:600;letter-spacing:-.008em}
.gapbtn .go{grid-column:2;display:flex;align-items:center;gap:4px;margin-top:6px;
  font-size:12.5px;font-weight:500;color:var(--gold)}
.gapbtn .go .chev{width:13px;height:13px;opacity:.9}
.note-w{border-left:1.5px solid var(--ln2);padding:2px 0 2px 15px;font-size:12.5px;color:var(--ink3);
  line-height:1.6;margin:0 20px 20px;letter-spacing:0}
.note-w b{color:var(--ink2);font-weight:500}
.note-w.warn{border-left-color:var(--gold)}
.note-w.warn b{color:var(--gold)}
.note-w a{color:var(--ink);border-bottom:1px solid var(--ln2)}


/* ---------- Segmentierte Umschalter ---------- */
.seg{display:flex;background:var(--s2);border:1px solid var(--ln);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:8px;font-size:12.5px;color:var(--ink2);text-align:center;
  letter-spacing:-.005em;transition:background 200ms var(--e),color 200ms var(--e)}
.seg button.on{background:var(--s3);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.3)}

/* ---------- Ampel ---------- */
.lamp{display:inline-flex;align-items:center;gap:7px;font-size:12px;padding:5px 11px;border-radius:100px;
  border:1px solid var(--ln2);color:var(--ink2);letter-spacing:0}
.lamp i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block;flex:none}
.lamp.go{color:#7FB89A;border-color:rgba(127,184,154,.32)}
.lamp.hmm{color:var(--gold);border-color:rgba(194,161,91,.32)}
.lamp.no{color:var(--red);border-color:rgba(190,106,94,.32)}

/* ---------- Kalkulationsblatt ---------- */
.calc{margin:0;font-variant-numeric:tabular-nums;font-size:13.5px}
.calc .r{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:9px 0;
  border-bottom:1px solid var(--ln)}
.calc .r span{color:var(--ink3);letter-spacing:0;display:flex;gap:8px;align-items:baseline;min-width:0}
.calc .r span em{font-style:normal;color:var(--ink3);font-size:11.5px;white-space:nowrap;opacity:.85}
.calc .r b{font-weight:400;color:var(--ink2);white-space:nowrap}
.calc .r.sum{border-top:1px solid var(--ln2);border-bottom:none;padding-top:12px;margin-top:2px}
.calc .r.sum span,.calc .r.sum b{color:var(--ink);font-weight:500}
.calc .r.total{border-bottom:none;padding-top:14px}
.calc .r.total span{color:var(--ink2);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.calc .r.total b{color:var(--ink);font-size:22px;font-weight:600;letter-spacing:-.03em}
.calc .r.faint span,.calc .r.faint b{color:var(--ink3)}

/* ---------- Füllstandsbalken ---------- */
.fill{margin-top:4px}
.fill .track{height:32px;background:var(--s2);border:1px solid var(--ln);border-radius:8px;
  position:relative;overflow:hidden}
.fill .bar{position:absolute;inset:0 auto 0 0;background:var(--ink);opacity:.9;
  transform-origin:left;animation:grow 720ms var(--e) both}
.fill .bar.over{background:var(--red)}
.fill .tick{position:absolute;top:0;bottom:0;width:1px;background:var(--ln2)}
.fill .lg{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--ink3);
  font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px;margin-top:6px}
.kpi{padding:13px 0;border-bottom:1px solid var(--ln)}
.kpi span{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px}
.kpi b{font-size:17px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi b small{font-size:12px;color:var(--ink3);font-weight:400;margin-left:5px;letter-spacing:0}

/* ---------- Mehrfachauswahl ---------- */
.selbar{position:fixed;left:calc(var(--sal) + 12px);right:calc(var(--sar) + 12px);
  bottom:calc(var(--nav) + var(--sab) + 12px);transform:translate3d(0,calc(-1 * var(--kb)),0);
  transition:transform 200ms var(--e);z-index:45;
  background:rgba(35,34,32,.94);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border:1px solid var(--ln2);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;
  box-shadow:0 12px 36px rgba(0,0,0,.55);animation:rise 280ms var(--e) both}
.selbar .n{font-size:13px;font-weight:600;padding:0 4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.selbar .acts{display:flex;gap:7px;flex:1;overflow-x:auto;scrollbar-width:none}
.selbar .acts::-webkit-scrollbar{display:none}
.selbar button.a{flex:none;background:var(--s1);border:1px solid var(--ln2);border-radius:9px;padding:8px 11px;
  font-size:12.5px;color:var(--ink);display:flex;align-items:center;gap:6px;white-space:nowrap}
.selbar button.a:active{opacity:.6}
.selbar button.a.dgr{color:var(--red)}
body.hassel #nav{opacity:.5}

/* ---------- Vollbild-Fotoanzeige ---------- */
.viewer{position:fixed;inset:0;z-index:80;background:#050505;display:flex;flex-direction:column;
  animation:fadein 220ms var(--e) both}
.viewer.out{animation:fadein 180ms var(--e) reverse both}
.viewer .vtop{display:flex;align-items:center;gap:12px;
  padding:calc(var(--sat) + 10px) calc(var(--sar) + 16px) 10px calc(var(--sal) + 16px);
  color:var(--ink);font-size:13px}
.viewer .vtop .sp{flex:1;color:var(--ink2);font-variant-numeric:tabular-nums}
.viewer .vbody{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;align-items:center}
.viewer .vbody::-webkit-scrollbar{display:none}
.viewer .vbody .slide{min-width:100%;height:100%;scroll-snap-align:center;display:grid;place-items:center;
  overflow:auto;-webkit-overflow-scrolling:touch}
.viewer .vbody img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.viewer .vfoot{padding:12px calc(var(--sar) + 16px) calc(14px + var(--sab)) calc(var(--sal) + 16px);display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.viewer .vfoot::-webkit-scrollbar{display:none}

/* ---------- Fotorollen ---------- */
.rolechip{position:absolute;left:6px;bottom:6px;background:rgba(10,10,9,.7);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border-radius:100px;padding:2px 8px;font-size:9.5px;color:var(--ink2);letter-spacing:.04em;text-transform:uppercase}
.phcell{position:relative;flex:none}

/* ---------- Statistik ---------- */
.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px}
.statgrid .kpi:nth-last-child(-n+2){border-bottom:none}
.blist{margin-top:6px}
.brow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:11px 0;border-bottom:1px solid var(--ln);
  font-size:13.5px;align-items:baseline}
.brow .lb{color:var(--ink);letter-spacing:-.008em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .vl{color:var(--ink2);font-variant-numeric:tabular-nums;font-size:13px}
.brow .tr{grid-column:1/-1;height:2px;background:var(--ln);border-radius:2px;overflow:hidden;margin-top:3px}
.brow .tr i{display:block;height:100%;background:var(--ink2);border-radius:2px;
  transform-origin:left;animation:grow 640ms var(--e) both}

/* ---------- Verhandlungs-Log ---------- */
.neg{margin-top:2px}
.negrow{display:flex;align-items:baseline;gap:11px;padding:10px 0;border-bottom:1px solid var(--ln);font-size:13.5px}
.negrow .who{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);width:70px;flex:none}
.negrow .amt{flex:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.negrow .dt{color:var(--ink3);font-size:11.5px;font-variant-numeric:tabular-nums}
.negrow.me .amt{color:var(--ink2)}
.negrow.deal .amt{color:var(--ink);font-weight:600}

/* ---------- Statusleiste oben ---------- */
.banner{margin:0 20px 16px;border-radius:11px;padding:11px 14px;font-size:12.5px;line-height:1.5;
  display:flex;align-items:center;gap:11px;background:var(--s2);border:1px solid var(--ln2);color:var(--ink2)}
.banner b{color:var(--ink);font-weight:500}
.banner svg.ic{color:var(--gold);flex:none}
.banner button{margin-left:auto;flex:none;color:var(--ink);font-size:12.5px;font-weight:500;
  border:1px solid var(--ln2);border-radius:8px;padding:7px 11px;white-space:nowrap}
.banner.warn{border-color:rgba(198,164,94,.34);background:rgba(198,164,94,.06)}

/* ---------- Gruppenüberschrift in der Liste ---------- */
.ghead{grid-column:1/-1;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);
  padding:14px 0 2px;display:flex;justify-content:space-between;align-items:baseline}
.ghead em{font-style:normal;font-variant-numeric:tabular-nums;letter-spacing:0}

/* ---------- Druckansicht für Anfragen ---------- */
@media print{
  body{background:#fff;color:#000}
  #nav,.topbar,.selbar{display:none!important}
  .rfq{padding:0!important}
  .rfq *{color:#000!important;border-color:#bbb!important;background:transparent!important}
}

/* ---------- Sprachnotizen ---------- */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.rec{position:fixed;left:calc(var(--sal) + 12px);right:calc(var(--sar) + 12px);
  bottom:calc(var(--nav) + var(--sab) + 12px);transform:translate3d(0,calc(-1 * var(--kb)),0);
  transition:transform 200ms var(--e);z-index:70;
  background:rgba(35,34,32,.96);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border:1px solid var(--ln2);border-radius:14px;padding:13px 15px;display:flex;align-items:center;gap:13px;
  box-shadow:0 12px 36px rgba(0,0,0,.6);animation:rise 260ms var(--e) both}
.rec .dot{width:9px;height:9px;border-radius:50%;background:var(--red);flex:none;animation:pulse 1.1s infinite}
.rec .t{flex:1;font-size:13.5px}
.rec .t b{display:block;font-weight:500}
.rec .t small{color:var(--ink3);font-size:11.5px;font-variant-numeric:tabular-nums}
.rec button{flex:none;border-radius:9px;padding:9px 14px;font-size:13px;font-weight:600}
.rec .stop{background:var(--ink);color:var(--bg)}
.rec .cancel{color:var(--ink3)}
.arow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--ln)}
.arow:last-child{border-bottom:none}
.arow .pl{width:34px;height:34px;border-radius:50%;border:1px solid var(--ln2);display:grid;place-items:center;
  color:var(--ink);flex:none;transition:background 160ms var(--e)}
.arow .pl:active{background:var(--s3)}
.arow .meta{flex:1;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.arow .meta small{display:block;color:var(--ink3);font-size:11px;margin-top:2px}

/* ---------- Startseite als Übersicht ---------- */
.ctx{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:10px 0 26px}
.ctx .who{font-size:15px;font-weight:600;letter-spacing:.3em;color:var(--ink)}
.ctx .when{font-size:11.5px;color:var(--ink3);letter-spacing:0;text-align:right;line-height:1.5}

.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.tile{background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:12px 8px 11px;
  display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--ink);
  transition:transform 150ms var(--e),border-color 180ms var(--e)}
.tile:active{transform:scale(.965)}
.tile svg.ic{width:17px;height:17px;color:var(--ink3)}
.tile b{font-size:19px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.tile span{font-size:9.5px;color:var(--ink3);letter-spacing:.03em;text-align:center;line-height:1.25}
.tile.hot{border-color:var(--ln2)}
.tile.hot svg.ic{color:var(--gold)}
.tile.zero b{color:var(--ink3)}

.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.dtile{background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:14px;
  display:flex;align-items:center;gap:11px;color:var(--ink);
  transition:transform 150ms var(--e)}
.dtile:active{transform:scale(.98)}
.dtile svg.ic{color:var(--ink3)}
.dtile .dt{flex:1;min-width:0}
.dtile .dt b{display:block;font-size:13.5px;font-weight:500;letter-spacing:-.008em}
.dtile .dt small{display:block;font-size:11px;color:var(--ink3);margin-top:2px;
  font-variant-numeric:tabular-nums;letter-spacing:0}

.recent{display:flex;gap:11px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}
/* 9 px + 11 px Abstand ergeben die 20 px Randabstand der übrigen Seite */
.recent::before,.recent::after{content:"";flex:none;width:9px}
.recent::-webkit-scrollbar{display:none}
.rcard{flex:none;width:112px;transition:transform 150ms var(--e)}
.rcard:active{transform:scale(.97)}
.rcard .rw{position:relative;width:112px;height:112px;border-radius:12px;overflow:hidden;background:var(--s2);display:block}
.rcard .rw img{width:100%;height:100%;object-fit:cover;display:block}
.rcard .rw .ph-none{width:100%;height:100%;display:grid;place-items:center;color:var(--ink3)}
.rcard .rw .badge2{position:absolute;top:7px;left:7px;display:flex;align-items:center;justify-content:center;
  width:20px;height:20px;border-radius:50%;background:rgba(10,10,9,.6);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.rcard b{display:block;font-size:12.5px;font-weight:500;margin-top:8px;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard small{display:block;font-size:11.5px;color:var(--ink3);margin-top:2px;
  font-variant-numeric:tabular-nums;letter-spacing:0}

/* ---------- Erfassen: grosse Aufnahmeflaeche und feste Aktionsleiste ---------- */
.shot{width:100%;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:var(--s1);
  border:1px solid var(--ln);position:relative;display:block;
  transition:transform 150ms var(--e),border-color 180ms var(--e)}
.shot:active{transform:scale(.99)}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .hint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;color:var(--ink3)}
.shot .hint b{font-size:13.5px;font-weight:500;color:var(--ink2);letter-spacing:-.008em}
.shot .hint small{font-size:11.5px;letter-spacing:0}
.shot .cnt{position:absolute;right:10px;bottom:10px;background:rgba(10,10,9,.62);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-radius:100px;padding:4px 11px;font-size:11px;color:var(--ink);letter-spacing:.02em}
.roles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.roles button{background:var(--s1);border:1px solid var(--ln);border-radius:11px;padding:11px 4px;
  display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink2);font-size:10px;
  letter-spacing:.02em;transition:transform 140ms var(--e),color 160ms var(--e)}
.roles button:active{transform:scale(.96);color:var(--ink)}
.roles button svg.ic{width:18px;height:18px}
.roles button.rec-on{color:var(--red);border-color:rgba(190,106,94,.4)}

.iconrow{display:flex;gap:8px}
.iconrow button{flex:1;background:transparent;border:1px solid var(--ln2);border-radius:11px;
  padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;
  color:var(--ink3);font-size:10.5px;letter-spacing:.02em;
  transition:background 180ms var(--e),color 180ms var(--e),border-color 180ms var(--e),transform 140ms var(--e)}
.iconrow button:active{transform:scale(.96)}
.iconrow button.on{color:var(--bg);font-weight:600}
.iconrow button.on[data-v="must"]{background:var(--gold);border-color:var(--gold)}
.iconrow button.on[data-v="fav"]{background:var(--rose);border-color:var(--rose)}
.iconrow button.on[data-v="maybe"]{background:var(--sky);border-color:var(--sky)}
.iconrow button.on[data-v="no"]{background:var(--red);border-color:var(--red)}

.actbar{position:fixed;left:var(--sal);right:var(--sar);bottom:calc(var(--nav) + var(--sab));z-index:44;
  transform:translate3d(0,calc(-1 * var(--kb)),0);
  transition:transform 200ms var(--e);will-change:transform;
  padding:11px 20px calc(11px);background:rgba(10,10,9,.9);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--ln);display:flex;gap:9px}
body.hasact #app{padding-bottom:calc(var(--nav) + var(--sab) + 90px)}

details.more{border-top:1px solid var(--ln);margin-top:6px}
details.more>summary{list-style:none;cursor:pointer;padding:15px 0;display:flex;align-items:center;
  gap:9px;font-size:13.5px;color:var(--ink2);letter-spacing:-.008em}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary svg.ic{color:var(--ink3);transition:transform 240ms var(--e)}
details.more[open]>summary svg.ic{transform:rotate(90deg)}
details.more .inner{padding-bottom:6px;animation:rise 260ms var(--e) both}

/* ---------- Abschnitte ohne Kastenoptik ---------- */
.sec{background:transparent;border:none;border-top:1px solid var(--ln);border-radius:0;
  padding:20px 0 4px;margin:0 20px 0}
.sec h3{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);margin:0 0 14px;font-weight:500}

.card .phn{position:absolute;top:8px;right:8px;background:rgba(10,10,9,.6);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:100px;
  padding:2px 7px;font-size:10px;color:var(--ink);font-variant-numeric:tabular-nums}
.lampdot{display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:5px;vertical-align:1px}
.lampdot.go{background:#7FB89A}
.lampdot.hmm{background:var(--gold)}
.lampdot.no{background:var(--red)}
.toolrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;
  font-size:11.5px;color:var(--ink3);letter-spacing:0}
.toolrow button{display:flex;align-items:center;gap:7px;color:var(--ink2);font-size:11.5px;
  border:1px solid var(--ln);border-radius:100px;padding:6px 11px;white-space:nowrap}
.toolrow button:active{opacity:.6}
.toolrow button svg.ic{width:13px;height:13px;color:var(--ink3)}

.savenote{font-size:11.5px;color:var(--ink3);letter-spacing:0;margin:-6px 0 14px;text-align:center}
.savenote #savedot{color:var(--ink2)}
details.more>summary span{margin-left:auto}

.pastebtn{flex:none;display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2);
  border:1px solid var(--ln2);border-radius:9px;padding:9px 12px;white-space:nowrap;
  transition:color 160ms var(--e),border-color 160ms var(--e),transform 140ms var(--e)}
.pastebtn:active{transform:scale(.96);color:var(--ink)}
.pastebtn svg.ic{color:var(--ink3)}

/* Gewinnerzelle im Vergleich: getönt statt Punkt */
table.cmp td.win{color:var(--ink);font-weight:600;background:rgba(243,241,237,.055);
  box-shadow:inset 0 0 0 1px rgba(243,241,237,.09);border-radius:4px}
table.cmp tr.same td{color:var(--ink3)}
table.cmp tr.same td:first-child{color:var(--ln2)}
.cmpwrap{position:relative}
.cmpwrap::after{content:"";position:absolute;top:0;right:0;bottom:0;width:34px;pointer-events:none;
  background:linear-gradient(90deg,rgba(10,10,9,0),var(--bg))}

/* Backup: Zustandszeile unter der Hauptaktion */
.bkstate{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;
  color:var(--ink2);letter-spacing:0;margin-top:-12px}
.bkstate svg.ic{color:#7FB89A}
.bkstate.due{color:var(--gold)}
.bkstate.due svg.ic{color:var(--gold)}

/* Tastatur offen: Navigation verschwindet, die Aktionsleiste rueckt direkt
   ueber die Tastatur. Sonst klebt sie auf iOS mitten im Bild. */
body.kbopen #nav{transform:translate3d(0,100%,0)}
body.kbopen .actbar,body.kbopen .selbar,body.kbopen .rec{
  transform:translate3d(0,calc(var(--nav) + var(--sab) - var(--kb)),0)}
body.kbopen .toast{bottom:calc(var(--kb) + 18px)}
/* Die fixierten Leisten duerfen nie an der Eintrittsanimation haengen —
   ein transformierter Vorfahre macht aus position:fixed sonst position:absolute. */
#app.enter>.actbar{animation:none}

/* ============================================================
   Grosse Telefone (iPhone Pro Max und aufwaerts, ab 430 pt)
   Mehr Breite heisst nicht groessere Schrift — in Punkten ist ein
   Buchstabe auf jedem iPhone gleich gross. Mehr Breite heisst:
   mehr Inhalt je Zeile und grosszuegigere Trefferflaechen.
   ============================================================ */
@media (min-width:430px){
  .pad,.topbar{padding-left:24px;padding-right:24px}
  .grid{padding-left:24px;padding-right:24px;gap:16px 14px}
  /* Moebel sind breiter als hoch. Auf dem grossen Schirm schneidet 4:3
     besser zu und es passt eine dreiviertel Reihe mehr auf die Seite. */
  .card .phw{aspect-ratio:4/3}
  /* Die Aufnahmeflaeche darf nicht die ganze Hoehe fressen — Preisfeld und
     Waehrung sollen ohne Scrollen mit auf den Schirm. */
  .shot{aspect-ratio:auto;height:min(46vh,420px)}
  .recent::before,.recent::after{width:13px}
  .rcard,.rcard .rw{width:126px}
  .rcard .rw{height:126px}
  /* Trefferflaechen auf die 44 pt, die Apple verlangt */
  .sprow{padding:14px 0}
  .chipset button{padding:11px 15px}
  .row{min-height:52px}
  #nav a{font-size:10px}
  .card .nm{font-size:13.5px}
  .card .pr{font-size:13.5px}
  /* Der Preis darf auf dem grossen Schirm gross sein */
  .bigprice{font-size:33px}
  .sheetact .btn{padding:14px 15px}
}

/* ============================================================
   Querformat. Ohne das frisst ein einziges Produktfoto den
   ganzen Bildschirm und die Navigation die halbe Hoehe.
   ============================================================ */
@media (orientation:landscape) and (max-height:560px){
  :root{ --nav:46px }
  #app{padding-top:calc(var(--sat) + 2px)}
  .topbar{padding-top:6px;padding-bottom:10px;min-height:38px}
  .topbar h1{font-size:18px}
  .gal .scroller img{aspect-ratio:4/3;height:38vh;max-height:none;width:auto;min-width:0}
  .gal .galadd{flex:1 0 22%;width:auto;aspect-ratio:auto;height:38vh;font-size:11px}
  .gal .count{bottom:8px;right:10px}
  .galempty{height:58px}
  .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .card .phw{aspect-ratio:4/3}
  .sheetbx{max-height:94vh;padding-top:8px}
  .sheetbx .grab{margin-bottom:12px}
  /* Weniger Rahmenwerk, damit im Querformat Ware statt Bedienung zu sehen ist */
  .searchw{margin-bottom:11px}
  .search{padding-top:10px;padding-bottom:10px}
  .chipset button{padding:8px 12px;font-size:13px}
  .toolrow{margin-bottom:9px}
  .grouplbl{margin:18px 0 9px}
  #nav a{flex-direction:row;gap:8px;font-size:11.5px}
  #nav .badge{top:50%;margin-top:-15px;left:auto;right:calc(50% - 36px);margin-left:0}
  #nav a svg.ic{width:19px;height:19px}
  .bigprice{font-size:28px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
  img[data-ph]{opacity:1}
}

<script>
"use strict";
/* ============================================================
   SOURCE — Sourcing-App für Möbelmessen. Offline-first, lokal.
   Keine externen Abhängigkeiten. Alle Daten in IndexedDB.
   ============================================================ */

/* ---------- Konstanten ---------- */
const CUR = {
  CNY:{sym:"¥", name:"RMB"},
  USD:{sym:"$", name:"USD"},
  EUR:{sym:"€", name:"EUR"}
};
const PRICE_KINDS = ["EXW","FOB","CIF","DDP","unbekannt"];
const BASIS = {piece:"pro Stück", set:"pro Set", carton:"pro Karton"};
const CATS = ["Sofas","Chairs","Tables","Beds","Cabinets","Lighting","Outdoor","Accessories"];
const TAGS = ["Hotel","Apartment","Luxury","Minimal","Japandi","Outdoor","Potential Business","Buy for myself"];
const STATUS = {
  must :{ i:"star",  t:"Must Buy",   c:"var(--gold)" },
  fav  :{ i:"heart", t:"Favorit",    c:"var(--rose)" },
  maybe:{ i:"help",  t:"Vielleicht", c:"var(--sky)"  },
  no   :{ i:"close", t:"Nein",       c:"var(--red)"  }
};
const SUP_CHECKS = ["wirkt professionell","eigener Hersteller","Trader","Export nach Europa",
                    "CE / Zertifikate","Customization möglich","Logo möglich","Samples möglich"];
const PHOTO_ROLES = {
  product:{ t:"Produkt",      i:"image" },
  price  :{ t:"Preisschild",  i:"table" },
  card   :{ t:"Visitenkarte", i:"card" },
  booth  :{ t:"Messestand",   i:"building" },
  catalog:{ t:"Katalog",      i:"file" },
  detail :{ t:"Detail",       i:"search" }
};
/* Nutzbares Ladevolumen, nicht Nennvolumen — Möbel lassen sich nicht lückenlos stapeln. */
const CONTAINERS = {
  "20":   { t:"20′ Standard",  cbm:28 },
  "40":   { t:"40′ Standard",  cbm:56 },
  "40HQ": { t:"40′ High Cube", cbm:68 }
};
const SORTS = {
  new:      { t:"Neueste zuerst",   f:(a,b)=> b.createdAt - a.createdAt },
  old:      { t:"Älteste zuerst",   f:(a,b)=> a.createdAt - b.createdAt },
  priceAsc: { t:"Preis aufsteigend",f:(a,b)=> (priceIn(a,"EUR") ?? 1e15) - (priceIn(b,"EUR") ?? 1e15) },
  priceDesc:{ t:"Preis absteigend", f:(a,b)=> (priceIn(b,"EUR") ?? -1)   - (priceIn(a,"EUR") ?? -1) },
  score:    { t:"Beste Note",       f:(a,b)=> (score(b) ?? -1) - (score(a) ?? -1) },
  cbm:      { t:"Volumen",          f:(a,b)=> (itemCbm(b) ?? -1) - (itemCbm(a) ?? -1) },
  name:     { t:"Name A–Z",         f:(a,b)=> (a.title||"").localeCompare(b.title||"") }
};

const nf = (n,d)=> (n==null||isNaN(n)) ? "–" :
  n.toLocaleString("de-DE",{minimumFractionDigits:d||0, maximumFractionDigits:d||0});
function money(amount, cur, dec){

function ago(ts){

  if(m < 1) return "gerade eben";
  if(m < 60) return m + " Min.";
  const h = Math.floor(m/60);
  if(h < 24) return h + " Std.";
  const d = Math.floor(h/24);

}
function dstamp(ts){

  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());

function toast(msg, ms){

  const t = document.createElement("div");

/* ---------- IndexedDB ---------- */
const DB = (()=>{
  const NAME = "source-db", VER = 2;
  const STORES = ["products","suppliers","fairs","photos","settings","audio"];
  let dbp = null;

  function open(){
    if(dbp) return dbp;
    dbp = new Promise((res,rej)=>{
      const r = indexedDB.open(NAME, VER);
      r.onupgradeneeded = e => {
        const db = e.target.result;
        STORES.forEach(s => { if(!db.objectStoreNames.contains(s)) db.createObjectStore(s,{keyPath:"id"}); });
      };
      r.onsuccess = e => res(e.target.result);
      r.onerror   = () => rej(r.error);
    });
    return dbp;
  }
  function tx(store, mode){
    return open().then(db => db.transaction(store, mode).objectStore(store));
  }
  const req = r => new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });

  return {
    get : (s,id)=> tx(s,"readonly").then(o => req(o.get(id))),
    all : s => tx(s,"readonly").then(o => req(o.getAll())),
    put : (s,v)=> tx(s,"readwrite").then(o => req(o.put(v))),
    del : (s,id)=> tx(s,"readwrite").then(o => req(o.delete(id))),
    clear: s => tx(s,"readwrite").then(o => req(o.clear())),
    stores: STORES
  };
})();

async function loadAll(){

/* ---------- Fotos ---------- */
/* Ein Foto vom 17 Pro Max hat 24 Megapixel, im Modus fuer maximale
   Aufloesung 48. Das zweimal parallel zu dekodieren — einmal fuers Bild,
   einmal fuers Vorschaubild — hat auf iOS die Seite gekillt. Also einmal
   dekodieren und beide Groessen aus derselben Quelle ziehen.
   imageOrientation:"from-image" ist Pflicht: ohne das ignoriert
   createImageBitmap die EXIF-Drehung und hochkant fotografierte Moebel
   liegen quer. Der <img>-Weg dreht von sich aus richtig. */
/* Aus einem technischen Fehler wird ein Satz, der sagt, was zu tun ist. */
function humanError(e){
  /* Name und Text zusammen pruefen — bei einem Error ist der Name immer
     gesetzt ("Error"), der Grund steht aber im Text. */
  const m = e ? [e.name, e.message].filter(Boolean).join(" ") || String(e) : "";
  if(/quota|QuotaExceeded|storage/i.test(m)) return "Speicher voll — erst sichern und aufräumen";
  if(/nicht lesbar|decode|NotReadable|Image/i.test(m)) return "Bild nicht lesbar";
  return null;
}
async function decodeImage(file){
  if(typeof createImageBitmap === "function"){
    const bmp = await createImageBitmap(file, {imageOrientation:"from-image"}).catch(()=>null);
    if(bmp) return bmp;
  }
  return new Promise((res,rej)=>{
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = ()=>{ URL.revokeObjectURL(u); res(img); };
    img.onerror = ()=>{ URL.revokeObjectURL(u); rej(new Error("Bild nicht lesbar")); };
    img.src = u;
  });
}
/* In Halbierungsschritten verkleinern. Ein einziger Sprung von 8000 auf
   1600 Pixel franst sichtbar aus — Canvas filtert bei mehr als Faktor zwei
   nur grob. */
function downscale(src, max, quality){
  const w0 = src.width, h0 = src.height;
  const sc = Math.min(1, max / Math.max(w0,h0));
  const fw = Math.max(1, Math.round(w0*sc)), fh = Math.max(1, Math.round(h0*sc));
  let cur = src, cw = w0, ch = h0;
  while(cw * 0.5 > fw){
    const nw = Math.max(1, Math.round(cw/2)), nh = Math.max(1, Math.round(ch/2));
    const c = document.createElement("canvas"); c.width = nw; c.height = nh;
    const cx = c.getContext("2d"); cx.imageSmoothingQuality = "high";
    cx.drawImage(cur, 0, 0, nw, nh);
    cur = c; cw = nw; ch = nh;
  }
  const cv = document.createElement("canvas"); cv.width = fw; cv.height = fh;
  const ctx = cv.getContext("2d"); ctx.imageSmoothingQuality = "high";
  ctx.drawImage(cur, 0, 0, fw, fh);
  return new Promise(res => cv.toBlob(res, "image/jpeg", quality));
}
async function shrink(file, max, quality){
  const src = await decodeImage(file);
  const out = await downscale(src, max, quality);
  if(src.close) src.close();
  return out;
}
async function addPhoto(file, role){
  const src = await decodeImage(file);
  const blob  = await downscale(src, 1600, .8);
  const thumb = await downscale(src, 400,  .7);
  if(src.close) src.close();
  const rec = { id:uid(), blob, thumb, role: role || "product", takenAt: file.lastModified || Date.now() };
  await DB.put("photos", rec);
  S.photoMeta.set(rec.id, {role: rec.role, takenAt: rec.takenAt});
  return rec.id;
}
async function photoUrl(id, thumb){
  const key = (thumb?"t:":"f:") + id;
  if(S.photoUrls.has(key)) return S.photoUrls.get(key);
  const rec = await DB.get("photos", id);
  if(!rec) return "";
  const url = URL.createObjectURL(thumb ? (rec.thumb || rec.blob) : rec.blob);
  S.photoUrls.set(key, url);
  trimPhotoCache();
  return url;
}
/* Bilder laden erst, wenn sie in die Nähe des Sichtfelds kommen.
   Bei 300 Produkten würden sonst 300 Object-URLs auf einmal entstehen und
   ihre Blobs im Speicher festhalten. */
const PHOTO_CACHE_MAX = 120;
let PHOTO_OBS = null;
function photoObserver(){
  if(PHOTO_OBS || !("IntersectionObserver" in window)) return PHOTO_OBS;
  PHOTO_OBS = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if(!e.isIntersecting) return;
      PHOTO_OBS.unobserve(e.target);
      loadPhotoInto(e.target);
    });
  }, {rootMargin:"400px 0px"});
  return PHOTO_OBS;
}
async function loadPhotoInto(el){
  const id = el.dataset.ph;
  if(!id) return;
  el.removeAttribute("data-ph");
  const url = await photoUrl(id, el.dataset.full !== "1");
  if(!url) return;
  el.src = url;
  requestAnimationFrame(() => el.classList.add("phload"));
}
function hydratePhotos(root){
  const nodes = (root || document).querySelectorAll("img[data-ph]");
  const obs = photoObserver();
  nodes.forEach(el => obs ? obs.observe(el) : loadPhotoInto(el));
}
/* Ältesten Eintrag freigeben. Ein Bild, das noch im DOM hängt, bekommt seine
   Kennung zurück, damit es beim nächsten Sichtbarwerden wieder lädt. */
function trimPhotoCache(){
  while(S.photoUrls.size > PHOTO_CACHE_MAX){
    const key = S.photoUrls.keys().next().value;
    const url = S.photoUrls.get(key);
    S.photoUrls.delete(key);
    document.querySelectorAll('img[src="' + url + '"]').forEach(el => {
      el.removeAttribute("src");
      el.classList.remove("phload");
      el.dataset.ph = key.slice(2);
      const obs = photoObserver();
      if(obs) obs.observe(el);
    });
    URL.revokeObjectURL(url);
  }
}
function releaseFullPhotos(){
  Array.from(S.photoUrls.keys()).filter(k => k.startsWith("f:")).forEach(k => {
    URL.revokeObjectURL(S.photoUrls.get(k));
    S.photoUrls.delete(k);
  });
}

/* ---------- Wechselkurse ---------- */
const FX = {
  /* Kurse sind relativ zu EUR: rates[X] = wieviel X für 1 EUR */
  conv(amount, from, to){
    const r = S.cfg.rates;
    if(amount == null || isNaN(amount)) return null;
    if(!r[from] || !r[to]) return null;
    return amount / r[from] * r[to];
  },
  all(amount, from){
    return Object.keys(CUR).map(c => ({ cur:c, val:FX.conv(amount, from, c) }));
  },
  stale(){ return !S.cfg.ratesTs || (Date.now() - S.cfg.ratesTs) > 36*3600*1000; },
  async refresh(){
    const sources = [
      { url:"https://api.frankfurter.app/latest?from=EUR&to=CNY,USD",
        pick: j => j && j.rates && j.rates.CNY && j.rates.USD ? {CNY:j.rates.CNY, USD:j.rates.USD} : null },
      { url:"https://open.er-api.com/v6/latest/EUR",
        pick: j => j && j.rates && j.rates.CNY && j.rates.USD ? {CNY:j.rates.CNY, USD:j.rates.USD} : null }
    ];
    for(const s of sources){
      try{
        const ctl = new AbortController();
        const to = setTimeout(()=>ctl.abort(), 8000);
        const res = await fetch(s.url, {signal:ctl.signal, cache:"no-store"});
        clearTimeout(to);
        if(!res.ok) continue;
        const got = s.pick(await res.json());
        if(!got) continue;
        S.cfg.rates = { EUR:1, CNY:got.CNY, USD:got.USD };
        S.cfg.ratesTs = Date.now();
        S.cfg.ratesManual = false;
        await saveCfg();
        return true;
      }catch(e){ /* nächste Quelle */ }
    }
    return false;
  }
};

/* ---------- Rechnen ---------- */
function score(p){
  const r = p.rate || {};
  const w = S.cfg.weights;
  const parts = [["design",r.design],["quality",r.quality],["price",r.price]]
                  .filter(x => typeof x[1] === "number");
  if(!parts.length) return null;
  let sw = 0, sv = 0;
  parts.forEach(([k,v]) => { sw += w[k]; sv += w[k]*v; });
  return sw ? Math.round(sv/sw*10)/10 : null;
}
function cbm(d){
  if(!d || !d.l || !d.w || !d.h) return null;
  return Math.round(d.l*d.w*d.h/1e6*1000)/1000;   // cm -> m³
}
/* Für Fracht und Container zählt der Karton. Nur wenn er fehlt, das Produktmaß. */
function itemCbm(p){ return cbm(p.carton) || cbm(p.dims) || null; }
function cbmSource(p){ return cbm(p.carton) ? "Karton" : (cbm(p.dims) ? "Produktmaß" : null); }

/* Einstandskosten je Stück in Euro. Gibt null zurück, wenn kein Preis da ist. */
function landed(p){
  const goods = priceIn(p, "EUR");
  if(goods == null) return null;
  const c = S.cfg, o = p.costs || {};
  const v = itemCbm(p);
  const freight = o.freight != null ? o.freight : (v != null ? v * c.freightPerCbm : null);
  const other   = o.other   != null ? o.other   : (v != null ? v * c.otherPerCbm   : null);
  const base    = goods + (freight || 0);
  const customs = o.customs != null ? o.customs : base * (c.customsPct || 0) / 100;
  const net     = goods + (freight || 0) + customs + (other || 0);
  const vat     = net * (c.vatPct || 0) / 100;
  return {
    goods, freight, customs, other, net, vat,
    gross: net + vat,
    /* Das ist die Zahl, mit der gerechnet wird: mit Vorsteuerabzug ohne EUSt. */
    eff: c.vatDeductible ? net : net + vat,
    cbm: v,
    partial: v == null      // ohne Maße fehlen Fracht und Nebenkosten
  };
}
function margin(p){
  const l = landed(p);
  if(!l || !p.targetPrice) return null;
  const factor = p.targetPrice / l.eff;
  return { factor, abs: p.targetPrice - l.eff, pct: (p.targetPrice - l.eff) / p.targetPrice * 100, eff:l.eff };
}
/* Ampel: erreicht der Zielpreis den gewünschten Kalkulationsfaktor? */
function lamp(p){
  const m = margin(p);
  if(!m) return null;
  const t = S.cfg.targetFactor || 1;
  if(m.factor >= t)        return { k:"go",   t:"rechnet sich" };
  if(m.factor >= t * 0.85) return { k:"hmm",  t:"knapp" };
  return { k:"no", t:"rechnet sich nicht" };
}
/* Bis zu welchem Einkaufspreis bleibt der Zielfaktor erhalten? */
function breakEven(p){
  const l = landed(p);
  if(!l || !p.targetPrice) return null;
  const maxEff = p.targetPrice / (S.cfg.targetFactor || 1);
  const delta  = maxEff - l.eff;                       // Luft in Euro auf die Einstandskosten
  const k      = 1 + (S.cfg.customsPct || 0) / 100;    // Zoll hängt am Warenwert mit dran
  const cur    = (p.price && p.price.currency) || "CNY";
  const maxGoodsEur = l.goods + delta / k;
  return maxGoodsEur > 0 ? { amount: FX.conv(maxGoodsEur, "EUR", cur), cur } : null;
}
/* Alte Signatur bleibt erhalten, wird an einigen Stellen noch benutzt. */
function freight(p){
  if(S.cfg.calcMode === "off") return null;
  const l = landed(p);
  return l ? l.freight : null;
}

/* ---------- Container ---------- */
function planItems(){
  return fairProducts().filter(p => p.plan);
}
function planQty(p){ return p.planQty || 1; }
function planTotals(){
  const items = planItems();
  let vol = 0, goods = 0, eff = 0, sales = 0, unknown = 0;
  items.forEach(p => {
    const q = planQty(p), v = itemCbm(p), l = landed(p);
    if(v) vol += v * q; else unknown++;
    const g = priceIn(p, "EUR");
    if(g != null) goods += g * q;
    if(l) eff += l.eff * q;
    if(p.targetPrice) sales += p.targetPrice * q;
  });
  const cap = (CONTAINERS[S.cfg.container] || CONTAINERS["40HQ"]).cbm;
  return { items, vol, goods, eff, sales, unknown, cap, pct: cap ? vol / cap * 100 : 0,
           pieces: items.reduce((n,p) => n + planQty(p), 0) };
}
function priceIn(p, cur){
  if(!p.price || p.price.amount == null) return null;
  return FX.conv(p.price.amount, p.price.currency || "CNY", cur);
}
function isComplete(p){
  return !!(p.price && p.price.amount != null) && !!p.supplierId
      && !!(p.price.kind && p.price.kind !== "unbekannt");
}
function missingOf(p){
  const m = [];
  if(!p.price || p.price.amount == null) m.push("Preis");
  if(!p.supplierId) m.push("Lieferant");
  if(!p.price || !p.price.kind || p.price.kind === "unbekannt") m.push("Preisart");
  if(!p.title) m.push("Name");
  return m;
}
</script>

<script>
"use strict";
/* ============================================================
   Views + Router
   ============================================================ */

const app = document.getElementById("app");
const navEl = document.getElementById("nav");

function go(hash){ location.hash = hash; }
function route(){ return (location.hash || "#/").slice(1); }

/* ---------- Kopfzeile ---------- */
function hdr(title, opts){
  opts = opts || {};
  return '<div class="topbar">'
    + (opts.back ? '<button class="back" onclick="history.length>1?history.back():go(\'/\')" aria-label="Zurück">' + ic("back") + '</button>' : "")
    + '<h1>' + esc(title) + '</h1>'
    + (opts.action ? '<button class="tb-act' + (opts.danger?" danger":"") + '" onclick="' + opts.action + '">' + esc(opts.actionLabel) + '</button>' : "")
    + '</div>';
}

/* ---------- Navigation ---------- */
function renderNav(){
  const r = route();
  const inbox = fairProducts().filter(p => !isComplete(p)).length;
  const items = [
    {h:"/",          n:"home",     t:"Start",     on:r==="/"},
    {h:"/products",  n:"grid",     t:"Produkte",  on:r.startsWith("/products")||r.startsWith("/p/")},
    {h:"/scan",      n:"camera",   t:"Scan",      on:r==="/scan"},
    {h:"/suppliers", n:"building", t:"Lieferant", on:r.startsWith("/suppliers")||r.startsWith("/s/")},
    {h:"/more",      n:"menu",     t:"Mehr",      on:["/more","/inbox","/compare","/halls","/settings","/fair"].some(x=>r.startsWith(x))}
  ];
  navEl.innerHTML = '<span id="navbar"></span>' + items.map(i =>
    '<a href="#' + i.h + '" class="' + (i.on?"on":"") + '">'
    + ic(i.n) + '<span>' + i.t + '</span>'
    + (i.h==="/more" && inbox ? '<span class="badge">' + inbox + '</span>' : "")
    + '</a>').join("");
  // Der Indikator gleitet auf den aktiven Eintrag.
  requestAnimationFrame(() => {
    const on = navEl.querySelector("a.on"), b = document.getElementById("navbar");
    if(!on || !b) return;
    const w = Math.round(on.offsetWidth * 0.34);
    b.style.width = w + "px";
    b.style.transform = "translateX(" + Math.round(on.offsetLeft + (on.offsetWidth - w)/2) + "px)";
  });
}

/* ============================================================
   START
   ============================================================ */
function row(icon, t, href, v){
  return '<a class="row" href="' + href + '">' + ic(icon)
    + '<span class="t">' + esc(t) + '</span>'
    + '<span class="v">' + (v===""||v==null ? "" : v) + '</span>'
    + '<span class="chev">' + ic("chev","s") + '</span></a>';
}

/* ============================================================
   SCAN — der 10-Sekunden-Flow
   ============================================================ */
function scanInherit(){
  const last = S.products[0];
  if(!last) return null;
  return { supplierId:last.supplierId, currency:last.price&&last.price.currency, kind:last.price&&last.price.kind };
}
function convLine(d){
  const a = d.price.amount;

function parseQuery(r){
  const i = r.indexOf("?");
  const out = {};
  if(i < 0) return out;
  r.slice(i+1).split("&").forEach(kv => {
    const [k,v] = kv.split("=");
    if(k) out[decodeURIComponent(k)] = decodeURIComponent(v||"");
  });
  return out;
}
function fchip(label, on, action, icon){
  return '<button class="fchip' + (on?" on":"") + '" onclick="' + action + '">'
    + (icon ? ic(icon,"s") : "") + esc(label) + '</button>';

async function setProductStatus(id, st){

  p.status = (p.status === st ? "" : st);
  p.updatedAt = Date.now();

/* ---------- Produkt bearbeiten ---------- */
/* Alles wird automatisch gesichert. Wer zurücktippt statt zu speichern,
   soll auf einer Messe nicht seine Eingaben verlieren. */
const SAVE_DELAY = 400;
const PENDING_SAVES = new Map();
function scheduleSave(store, obj){
  const key = store + ":" + obj.id;
  obj.updatedAt = Date.now();
  clearTimeout((PENDING_SAVES.get(key) || {}).t);
  PENDING_SAVES.set(key, { store, obj, t: setTimeout(() => {
    PENDING_SAVES.delete(key);
    DB.put(store, obj).then(markSaved);
  }, SAVE_DELAY) });
  const b = document.getElementById("savedot");
  if(b) b.textContent = "sichert…";
}
function markSaved(){
  const b = document.getElementById("savedot");
  if(b){ b.textContent = "gesichert"; }
}
async function flushSaves(){
  const items = Array.from(PENDING_SAVES.values());
  PENDING_SAVES.clear();
  for(const it of items){ clearTimeout(it.t); await DB.put(it.store, it.obj); }
  markSaved();
}
const autoSave    = p => scheduleSave("products", p);
const autoSaveSup = s => scheduleSave("suppliers", s);
/* Beim Verlassen der Seite und beim Schliessen der App nichts liegen lassen. */

/* ============================================================
   SMART INBOX
   ============================================================ */
const CLUSTER_GAP = 12*60*1000;   // 12 Minuten
function clusters(list){
  const sorted = list.slice().sort((a,b)=> a.createdAt - b.createdAt);
  const out = [];
  let cur = null;
  sorted.forEach(p => {
    if(!cur || (p.createdAt - cur.last) > CLUSTER_GAP){
      cur = { items:[p], first:p.createdAt, last:p.createdAt };
      out.push(cur);
    }else{
      cur.items.push(p); cur.last = p.createdAt;
    }
  });
  return out.reverse();
}
let GROUP_CACHE = [];
function assignGroup(i){
  const open = fairProducts().filter(p => !isComplete(p));
  GROUP_CACHE = clusters(open)[i] ? clusters(open)[i].items : [];

          + '<small>' + esc(p.title || "Ohne Namen") + '</small></span>'

      }).join("") + '</div></div>'

        + 'Am besten neben den offiziellen Hallenplan legen.</div>';
  }

}

/* ============================================================
   BACKUP — ZIP (store-only), JSON, CSV
   ============================================================ */
const ZIP = (()=>{
  let T = null;
  function table(){
    if(T) return T;
    T = new Uint32Array(256);
    for(let i=0;i<256;i++){ let c=i; for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); T[i]=c>>>0; }
    return T;
  }
  function crc32(u8){
    const t = table(); let c = 0xFFFFFFFF;
    for(let i=0;i<u8.length;i++) c = t[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  async function make(files){          // files: [{name, data:Uint8Array}]
    const enc = new TextEncoder(), parts = [], central = [];
    let off = 0;
    for(const f of files){
      const name = enc.encode(f.name), data = f.data, crc = crc32(data);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true);
      lh.setUint16(8,0,true); lh.setUint16(10,0,true); lh.setUint16(12,0,true);
      lh.setUint32(14,crc,true); lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true);
      lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
      parts.push(lh.buffer, name, data);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true);
      ch.setUint16(8,0x0800,true); ch.setUint16(10,0,true); ch.setUint16(12,0,true); ch.setUint16(14,0,true);
      ch.setUint32(16,crc,true); ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true);
      ch.setUint16(28,name.length,true); ch.setUint16(30,0,true); ch.setUint16(32,0,true);
      ch.setUint16(34,0,true); ch.setUint16(36,0,true); ch.setUint32(38,0,true); ch.setUint32(42,off,true);
      central.push(ch.buffer, name);
      off += 30 + name.length + data.length;
    }
    let cdSize = 0;
    central.forEach(p => cdSize += (p.byteLength != null ? p.byteLength : p.length));
    const eo = new DataView(new ArrayBuffer(22));
    eo.setUint32(0,0x06054b50,true); eo.setUint16(4,0,true); eo.setUint16(6,0,true);
    eo.setUint16(8,files.length,true); eo.setUint16(10,files.length,true);
    eo.setUint32(12,cdSize,true); eo.setUint32(16,off,true); eo.setUint16(20,0,true);
    return new Blob(parts.concat(central, [eo.buffer]), {type:"application/zip"});
  }
  async function read(blob){           // nur "stored" (Methode 0) — genau das, was make() schreibt
    const buf = new Uint8Array(await blob.arrayBuffer());
    const dv = new DataView(buf.buffer);
    let eocd = -1;
    for(let i = buf.length - 22; i >= 0 && i > buf.length - 65558; i--){
      if(dv.getUint32(i,true) === 0x06054b50){ eocd = i; break; }
    }
    if(eocd < 0) throw new Error("Keine gültige ZIP-Datei");
    const n = dv.getUint16(eocd+10,true);
    let p = dv.getUint32(eocd+16,true);
    const dec = new TextDecoder(), out = {};
    for(let i=0;i<n;i++){
      if(dv.getUint32(p,true) !== 0x02014b50) throw new Error("ZIP beschädigt");
      const method = dv.getUint16(p+10,true);
      const size   = dv.getUint32(p+24,true);
      const nlen   = dv.getUint16(p+28,true);
      const elen   = dv.getUint16(p+30,true);
      const clen   = dv.getUint16(p+32,true);
      const lho    = dv.getUint32(p+42,true);
      const name   = dec.decode(buf.subarray(p+46, p+46+nlen));
      const lnlen  = dv.getUint16(lho+26,true), lelen = dv.getUint16(lho+28,true);
      const start  = lho + 30 + lnlen + lelen;
      if(method !== 0) throw new Error("Komprimierte ZIPs werden nicht unterstützt");
      out[name] = buf.slice(start, start + size);
      p += 46 + nlen + elen + clen;
    }
    return out;
  }
  return {make, read};
})();

function download(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;

  h += '<div class="lbl-sec">Weitere Formate</div><div class="rows">'
    + '<button class="row wrap" onclick="expJson()">' + ic("file") + '<span class="t">Nur Daten als JSON'

async function expZip(btn){

                "L","B","H","m3","Karton L","Karton B","Karton H","Karton m3",

                "Im Container","Menge","Verhandlungen","Letztes Gebot",
                "Lieferant","Halle","Booth","Kontakt","WeChat","Supplier-Rating","Tags","Notiz","Erfasst"];
  const q = v => '"' + String(v==null?"":v).replace(/"/g,'""') + '"';

  const rows = fairProducts().map(p => {

            r2(l && l.freight), r2(l && l.customs), r2(l && l.other), r2(l && l.eff),
            r2(p.targetPrice), r2(m && m.factor), r2(m && m.pct),
            p.material, p.leadTime, p.status && STATUS[p.status] ? STATUS[p.status].t : "",
            p.stage && STAGES[p.stage] ? STAGES[p.stage].t : "",
            p.rate && p.rate.design, p.rate && p.rate.quality, p.rate && p.rate.price, r2(score(p)),
            p.plan ? "ja" : "", p.plan ? planQty(p) : "",
            (p.negotiations || []).length, neg ? CUR[neg.cur].sym + " " + neg.amount : "",
            s && s.name, s && s.hall, s && s.booth, s && s.contact, s && s.wechat, s && s.rating,
            (p.tags || []).join(" | "), p.note, dstamp(p.createdAt)].map(q).join(";");
  });
  download(new Blob(["﻿" + head.map(q).join(";") + "\n" + rows.join("\n")], {type:"text/csv;charset=utf-8"}),

/* Der Speicher laeuft schleichend voll: dreihundert Produkte mit je zwei
   Fotos sind achtzig Megabyte. Wer das erst merkt, wenn nichts mehr
   gesichert wird, hat einen Messetag verloren. */
async function checkStorage(){
  try{
    if(!navigator.storage || !navigator.storage.estimate) return;
    const est = await navigator.storage.estimate();
    if(!est.quota) return;
    const pct = est.usage / est.quota;
    const was = S.storagePct;
    S.storagePct = pct;
    S.storageMB = Math.round(est.usage / 1048576);
    if(pct >= 0.8 && (was == null || was < 0.8)) render();
  }catch(e){ /* ohne Angabe eben ohne Warnung */ }
}
async function showStorage(){
  const el = document.getElementById("storage");
  if(!el) return;
  try{
    const est = await navigator.storage.estimate();
    const used = (est.usage/1048576).toFixed(0), quota = (est.quota/1048576).toFixed(0);
    const persist = navigator.storage.persisted ? await navigator.storage.persisted() : false;
    el.textContent = used + " MB von ~" + quota + " MB belegt · " + (persist ? "dauerhaft gesichert" : "nicht als dauerhaft markiert");
  }catch(e){ el.textContent = "Speicherstand nicht verfügbar"; }
}

/* ============================================================
   ROUTER
   ============================================================ */

/* Scrollstand je Route merken. Auf einem 6,9-Zoll-Schirm passen dreissig
   Produkte untereinander — wer aus einem Detail zurueckkommt und wieder oben
   landet, sucht jedes Mal von vorn. */
const SCROLLPOS = new Map();
let LAST_ROUTE = route();
function rememberScroll(){ SCROLLPOS.set(LAST_ROUTE, window.scrollY || 0); }
function restoreScroll(r){
  const y = SCROLLPOS.get(r) || 0;
  if(!y){ window.scrollTo(0,0); return; }
  /* Erst nach dem Zeichnen, sonst ist die Seite noch nicht hoch genug. */
  requestAnimationFrame(() => requestAnimationFrame(() => {
    window.scrollTo(0, Math.min(y, document.body.scrollHeight - window.innerHeight));
  }));
}
window.addEventListener("hashchange", () => {
  rememberScroll();
  flushSaves();
  const r = route();
  window.scrollTo(0,0);
  render();
  restoreScroll(r);
  LAST_ROUTE = r;
});

function countUp(){
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  document.querySelectorAll("[data-count]").forEach(el => {
    const to = parseFloat(el.dataset.count), cur = el.dataset.cur;
    if(isNaN(to) || !to) return;
    const t0 = performance.now(), dur = 640;
    const step = now => {
      const k = Math.min(1, (now - t0) / dur);
      el.textContent = money(to * (1 - Math.pow(1 - k, 3)), cur);
      if(k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

  if(!SHEET) return;
  const {el, resolve} = SHEET;
  SHEET = null;
  el.classList.add("out");
  setTimeout(() => { if(el.parentNode) el.remove(); }, 230);

}

  const v = itemCbm(p), src = cbmSource(p);
