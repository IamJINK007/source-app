  h += '<div class="grouplbl first">Angaben</div>'
    + (seenCount("specrows") < 3
       ? '<div class="help" style="margin:-4px 0 6px">Jede Zeile lässt sich antippen — '
         + 'auch die schon ausgefüllten.</div>'
       : "")
    + '<div class="spec">'
    + srow(p, "supplier", "Lieferant", s ? esc(s.name) : null)
    + srow(p, "booth", "Stand", s ? (esc([s.hall && "Halle " + s.hall, s.booth].filter(Boolean).join(" · ")) || null) : null)
    + srow(p, "sku", "Modellnr.", esc(p.sku) || null)
    + srow(p, "category", "Kategorie", esc(p.category) || null)
    + srow(p, "variants", "Ausführungen", esc(p.variants) || null)
    + srow(p, "dims", "Produktmaß", dim(p.dims))
    + srow(p, "carton", "Kartonmaß", dim(p.carton))
    + (v ? srowRO("Volumen", nf(v,2) + ' m³ <span style="color:var(--ink3);font-size:11.5px">(' + src + ')</span>') : "")
    + srow(p, "material", "Material", esc(p.material) || null)
    + srow(p, "moq", "MOQ", p.moq ? esc(p.moq) + " Stück" : null)
    + srow(p, "leadTime", "Lead Time", esc(p.leadTime) || null)
    + '</div>';
  if(s) h += '<div style="margin-top:12px"><a class="suplink" href="#/s/' + s.id + '">'
    + ic("building","s") + esc(s.name) + ' öffnen' + ic("chev","chev") + '</a></div>';

  h += '<div class="grouplbl">Interesse</div>'
    + '<div class="chipset stat grid2">'
    + Object.keys(STATUS).map(k => '<button data-v="' + k + '" class="' + (p.status===k?"on":"") + '" '
       + 'onclick="setProductStatus(\'' + p.id + '\',\'' + k + '\')">' + ic(STATUS[k].i,"s") + STATUS[k].t + '</button>').join("")
    + '</div>';

  h += '<div class="grouplbl">Prozess</div>' + stageChips(p);

  h += '<div class="grouplbl">Tags</div><button class="tagline' + ((p.tags||[]).length ? "" : " gap") + '" data-f="tags" '
     + 'onclick="openField(\'' + p.id + '\',\'tags\')">'
     + ((p.tags||[]).length
        ? '<span class="tagrow">' + p.tags.map(t => '<span class="tag">' + esc(t) + '</span>').join("") + '</span>'
        : '<span class="ph">Tags vergeben</span>')
     + ic((p.tags||[]).length ? "chev" : "plus","chev") + '</button>';

  h += '<div style="display:flex;gap:9px;margin-top:20px">'
    + '<button class="btn' + (S.compare.has(p.id) ? " pri" : "") + '" onclick="toggleCompare(\'' + p.id + '\')">'
      + ic(S.compare.has(p.id) ? "check" : "scales","s") + 'Vergleich</button>'
    + '<button class="btn' + (p.plan ? " pri" : "") + '" onclick="togglePlan(\'' + p.id + '\')">'
      + ic(p.plan ? "check" : "box","s") + 'Container</button>'
    + '</div></div>';

  /* ---- Kalkulation ---- */
  if(l){
    h += '<div class="sec"><h3>Einstandskosten je Stück</h3><div class="calc">'
      + crow("Warenwert", l.goods, p.price ? money(p.price.amount, p.price.currency) : "")
      + crow("Fracht", l.freight, v ? nf(v,2) + " m³ × " + nf(S.cfg.freightPerCbm) + " €" : "Maße fehlen")
      + crow("Zoll", l.customs, nf(S.cfg.customsPct,1) + " %")
      + crow("Nebenkosten", l.other, v ? nf(v,2) + " m³ × " + nf(S.cfg.otherPerCbm) + " €" : "Maße fehlen")
      + '<div class="r total"><span>Landed Cost</span><b>' + money(l.eff,"EUR") + '</b></div>'
      + (S.cfg.vatDeductible
          ? '<div class="r faint"><span>EUSt ' + nf(S.cfg.vatPct) + ' %<em>durchlaufend</em></span><b>' + money(l.vat,"EUR") + '</b></div>'
          : "")
      + '</div>';
    if(l.partial)
      h += '<div class="help">Ohne Kartonmaß fehlen Fracht und Nebenkosten — die Zahl ist bis dahin zu niedrig.</div>';

    if(S.cfg.calcMode === "sales"){
      const m = margin(p), be = breakEven(p);
      h += '<div style="border-top:1px solid var(--ln);margin-top:16px;padding-top:16px">'
        + '<div class="field" style="margin-bottom:12px"><label>Ziel-Verkaufspreis netto (€)</label>'
        + '<input class="inp num" inputmode="decimal" placeholder="z. B. 1590" value="' + (p.targetPrice||"") + '" '
        + 'oninput="setTarget(\'' + p.id + '\',this.value)"></div>'
        + (m ? '<div class="calc">'
             + '<div class="r sum"><span>Marge</span><b>' + money(m.abs,"EUR") + ' · ' + nf(m.pct,1) + ' %</b></div>'
             + '<div class="r"><span>Kalkulationsfaktor<em>Ziel ' + nf(S.cfg.targetFactor,1) + ' ×</em></span><b>' + nf(m.factor,2) + ' ×</b></div>'
             + '</div>'
             + (lp ? '<div style="margin-top:14px"><span class="lamp ' + lp.k + '"><i></i>' + lp.t + '</span></div>' : "")
             + (be ? '<div class="help">Bis ' + money(be.amount, be.cur) + ' Einkaufspreis bleibst du über Faktor '
                     + nf(S.cfg.targetFactor,1) + '. Das ist deine Verhandlungsgrenze.</div>' : "")
           : '<div class="help">Zielpreis eintragen, dann rechnet die App Marge, Faktor und Verhandlungsgrenze.</div>')
        + '</div>';
    }
    h += '</div>';
  }

  /* ---- Einordnung gegen die eigenen Funde ---- */
  h += rankBlock(p);

  /* ---- Bewertung ---- */
  {
    const w = S.cfg.weights, rated = sc != null || Object.keys(p.rate||{}).length > 0;
    h += '<div class="sec"><h3>Bewertung</h3>'
      + '<button class="ratebox" data-f="rate" onclick="openField(\'' + p.id + '\',\'rate\')">'
      + (rated
         ? '<div class="score"><span class="n">' + (sc != null ? nf(sc,1) : "–") + '</span>'
           + '<span class="o">/ 10 gesamt</span>' + ic("chev","chev") + '</div>'
           + '<div class="bars">' + bar("Design", p.rate.design) + bar("Qualität", p.rate.quality)
           + bar("Preis", p.rate.price) + '</div>'
         : '<div class="score gap"><span class="o">Noch nicht bewertet</span>'
           + ic("plus","chev") + '</div>')
      + '</button>'
      + '<div class="help">Gewichtung ' + w.design + " / " + w.quality + " / " + w.price
      + ' % — in den Einstellungen änderbar.</div></div>';
  }

  /* ---- Verhandlung ---- */
  const neg = p.negotiations || [];
  h += '<div class="sec"><h3>Verhandlung</h3>'
    + (neg.length
       ? '<div class="neg">' + neg.slice().sort((a,b)=>a.date-b.date).map((n,i,arr) =>
           '<div class="negrow ' + (n.side === "me" ? "me" : "") + (i === arr.length-1 && n.deal ? " deal" : "") + '">'
           + '<span class="who">' + (n.side === "me" ? "Ich" : n.deal ? "Final" : "Angebot") + '</span>'
           + '<span class="amt">' + money(n.amount, n.cur) + '</span>'
           + '<span class="dt">' + dstamp(n.date).slice(5,10) + '</span>'
           + '<button onclick="delNeg(\'' + p.id + '\',\'' + n.id + '\')" style="color:var(--ink3)">' + ic("close","s") + '</button>'
           + '</div>').join("") + '</div>'
       : '<div class="help" style="margin:0 0 14px">Angebot, Gegenangebot, Ergebnis — mit Datum. '
         + 'Nach vier Messetagen weißt du sonst nicht mehr, wo ihr standet.</div>')
    + '<div style="display:flex;gap:8px;margin-top:14px">'
    + '<button class="btn sm" style="flex:1" onclick="addNeg(\'' + p.id + '\',\'supplier\')">Angebot</button>'
    + '<button class="btn sm" style="flex:1" onclick="addNeg(\'' + p.id + '\',\'me\')">Mein Gebot</button>'
    + '<button class="btn sm pri" style="flex:1" onclick="addNeg(\'' + p.id + '\',\'deal\')">Final</button>'
    + '</div></div>';

  h += audioBlock(p);

  h += '<div class="sec"><h3>Notiz</h3>'
     + '<button class="notebox' + (p.note ? "" : " gap") + '" data-f="note" '
     + 'onclick="openField(\'' + p.id + '\',\'note\')">'
     + '<span class="tx">' + (p.note ? esc(p.note) : "Was dir am Stand aufgefallen ist.") + '</span>'
     + ic(p.note ? "chev" : "plus","chev") + '</button></div>';

  h += '<div class="pad"><button class="btn" style="width:100%;margin-bottom:10px" onclick="shareProduct(\'' + p.id + '\')">'
     + ic("arrow","s") + 'Produkt teilen</button>'
     + '<button class="btn dgr" style="width:100%;margin-top:6px" '
     + 'onclick="delProduct(\'' + p.id + '\')">' + ic("trash","s") + 'Produkt löschen</button>'
     + '<div class="help" style="text-align:center;margin-top:14px">Erfasst ' + dstamp(p.createdAt) + '</div></div>';
  noteSeen("specrows");
  return h;
}
function crow(label, val, hint){
  return '<div class="r"><span>' + esc(label) + (hint ? '<em>' + esc(hint) + '</em>' : "") + '</span>'
       + '<b>' + (val == null ? "–" : money(val,"EUR")) + '</b></div>';
}
function bar(label, val){
  return '<div class="bar"><span>' + label + '</span>'
    + '<span class="tr"><i style="width:' + ((val||0)*10) + '%"></i></span>'
    + '<span class="vv">' + (val != null ? val : "–") + '</span></div>';
}

async function setTarget(id, v){
  const p = S.products.find(x => x.id === id); if(!p) return;
  const n = parseFloat(String(v).replace(/[^\d.,-]/g,"").replace(",","."));
  p.targetPrice = isNaN(n) ? null : n;
  await DB.put("products", p);
  clearTimeout(setTarget._t);
  setTarget._t = setTimeout(render, 700);
}
async function togglePlan(id){
  const p = S.products.find(x => x.id === id); if(!p) return;
  p.plan = !p.plan;
  if(p.plan && !p.planQty) p.planQty = p.moq || 1;
  await DB.put("products", p);
  toast(p.plan ? "Im Container-Planer" : "Aus dem Planer entfernt");
  render();
}

/* ---------- Verhandlung ---------- */
async function addNeg(pid, side){
  const p = S.products.find(x => x.id === pid); if(!p) return;
  const last = (p.negotiations||[]).slice(-1)[0];
  const cur = (last && last.cur) || (p.price && p.price.currency) || "CNY";
  const r = await askForm(
    side === "me" ? "Mein Gegenangebot" : side === "deal" ? "Finaler Preis" : "Angebot des Lieferanten",
    [{k:"amount", label:"Betrag in " + CUR[cur].name, placeholder:String((p.price && p.price.amount) || "")}],
    "Eintragen");
  if(!r) return;
  const n = parseFloat(String(r.amount).replace(/[^\d.,-]/g,"").replace(",","."));
  if(isNaN(n)){ toast("Keine gültige Zahl"); return; }
  p.negotiations = p.negotiations || [];
  p.negotiations.push({ id:uid(), date:Date.now(), side: side === "me" ? "me" : "supplier",
                        deal: side === "deal", amount:n, cur });
  if(side === "deal"){ p.price = p.price || {}; p.price.amount = n; p.price.currency = cur; }
  p.updatedAt = Date.now();
  await DB.put("products", p);
  toast(side === "deal" ? "Final übernommen — Preis aktualisiert" : "Eingetragen");
  render();
}
async function delNeg(pid, nid){
  const p = S.products.find(x => x.id === pid); if(!p) return;
  p.negotiations = (p.negotiations||[]).filter(n => n.id !== nid);
  await DB.put("products", p);
  render();
}

/* ---------- Duplikat-Hinweis ---------- */
function duplicatesOf(p){
  const mine = priceIn(p, "EUR");
  if(mine == null || !p.category) return [];
  return fairProducts().filter(o =>
    o.id !== p.id && o.category === p.category && o.supplierId !== p.supplierId &&
    (() => { const v = priceIn(o,"EUR"); return v != null && Math.abs(v - mine) / mine <= 0.15; })());
}
</script>


<script>
"use strict";
/* ============================================================
   AUSBAU B — Liste: Sortierung, Gruppierung, Mehrfachauswahl
   ============================================================ */

/* Eine einzige Auswahl für alles: Vergleich, Sammelaktionen, Container. */
function toggleCompare(id){ toggleSel(id); }
function toggleSel(id){
  if(!S.selMode) S.selMode = true;
  if(S.sel.has(id)) S.sel.delete(id); else S.sel.add(id);
  const el = document.querySelector('.card [data-sel="' + id + '"]');
  if(el){
    el.classList.toggle("on", S.sel.has(id));
    el.innerHTML = S.sel.has(id) ? ic("check","s") : "";
    paintSelBar();
  }else{
    render();
  }
}
function clearSel(){ S.sel.clear(); S.selMode = false; render(); }
function selProducts(){ return Array.from(S.sel).map(id => S.products.find(p => p.id === id)).filter(Boolean); }

function sortedFiltered(){
  const f = (SORTS[S.cfg.sort] || SORTS.new).f;
  return filtered().slice().sort(f);
}
function groupKey(p){
  switch(S.cfg.groupBy){
    case "supplier": { const s = supplierOf(p); return s ? s.name : "Ohne Lieferant"; }
    case "hall":     { const s = supplierOf(p); return s && s.hall ? "Hall " + s.hall : "Ohne Halle"; }
    case "category": return p.category || "Ohne Kategorie";
    case "status":   return p.status ? STATUS[p.status].t : "Ohne Status";
    case "stage":    return p.stage && STAGES[p.stage] ? STAGES[p.stage].t : "Noch nichts angefragt";
    default: return null;
  }
}

function viewProducts(r){
  const q = parseQuery(r);
  if(q.status !== undefined) S.filter.status = q.status;
  if(q.supplier) S.filter.supplier = q.supplier;
  if(q.hall) S.filter.hall = q.hall;
  if(q.tag) S.filter.tag = q.tag;

  const all = listBase();
  const cats = Array.from(new Set(all.map(p => p.category).filter(Boolean))).sort();
  const tags = Array.from(new Set(all.flatMap(p => p.tags || []))).sort();
  const active = S.filter.status || S.filter.cat || S.filter.supplier || S.filter.hall
              || S.filter.tag || S.filter.stage;
  const list = sortedFiltered();

  return hdr("Produkte", {back:true, action:"toggleSelMode()", actionLabel:S.selMode ? "Fertig" : "Auswählen"})
   + '<div class="pad"><div class="searchw">' + ic("search","s")
     + '<input class="search" placeholder="Name, Material, Stand, Notiz…" '
     + 'value="' + esc(S.filter.q) + '" oninput="S.filter.q=this.value;renderList()"></div></div>'
   + '<div class="filters">'
     + fchip("Alle", !active, "clearFilter()")
     + Object.keys(STATUS).map(k => fchip(STATUS[k].t, S.filter.status===k, "toggleFilter('status','" + k + "')", STATUS[k].i)).join("")
     + Object.keys(STAGES).map(k => fchip(STAGES[k].t, S.filter.stage===k, "toggleFilter('stage','" + k + "')", STAGES[k].i)).join("")
     + cats.map(c => fchip(c, S.filter.cat===c, "toggleFilter('cat'," + JSON.stringify(c).replace(/"/g,"&quot;") + ")")).join("")
     + tags.map(t => fchip(t, S.filter.tag===t, "toggleFilter('tag'," + JSON.stringify(t).replace(/"/g,"&quot;") + ")")).join("")
   + '</div>'
   + '<div class="pad toolrow">'
     + '<span>' + list.length + ' von ' + all.length + ' Produkten' + (S.allFairs ? ' · alle Messen' : "") + '</span>'
     + '<button onclick="openSortSheet()">' + esc(SORTS[S.cfg.sort].t) + ic("sliders","s") + '</button>'
   + '</div>'
   + '<div id="plist">' + productGrid(list) + '</div>'
   + selBar();
}

function renderList(){
  const el = document.getElementById("plist");
  if(!el) return;
  el.innerHTML = productGrid(sortedFiltered());
  hydratePhotos(el);
  armLongPress(el);
}
function selectAllShown(){
  const list = sortedFiltered();
  const allIn = list.every(p => S.sel.has(p.id));
  list.forEach(p => allIn ? S.sel.delete(p.id) : S.sel.add(p.id));
  render();
}

function productGrid(list){
  if(!list.length) return empty("grid","Nichts gefunden.","Filter zurücksetzen oder ein Produkt erfassen.");
  let out = '', last = null;
  list.forEach(p => {
    const g = groupKey(p);
    if(g !== null && g !== last){
      const n = list.filter(x => groupKey(x) === g).length;
      out += '<div class="ghead">' + esc(g) + '<em>' + n + '</em></div>';
      last = g;
    }
    out += productCard(p);
  });
  return '<div class="grid' + (S.cfg.groupBy === "none" ? " stagger" : "") + '">' + out + '</div>';
}
function productCard(p){
  const s = supplierOf(p);
  const sel = S.sel.has(p.id);
  const lp = S.cfg.calcMode === "sales" ? lamp(p) : null;
  const n = (p.photoIds || []).length;
  /* Im Auswahlmodus wird die Kachel zum Schalter, sonst bleibt sie ein Link.
     So verschwinden im Normalfall alle Auswahlkreise aus dem Raster. */
  const open = S.selMode ? 'onclick="toggleSel(\'' + p.id + '\')"' : 'href="#/p/' + p.id + '"';
  const tag  = S.selMode ? "button" : "a";
  return '<div class="card" data-id="' + p.id + '">'
    + '<' + tag + ' class="phw" ' + open + '>'
    + (p.photoIds && p.photoIds[0]
        ? '<img class="ph" data-ph="' + p.photoIds[0] + '" alt="' + esc(p.title||"Produkt") + '">'
        : '<div class="ph empty">' + ic("box") + '</div>')
    + '</' + tag + '>'
    + (p.status ? '<span class="st" style="color:' + STATUS[p.status].c + '">' + ic(STATUS[p.status].i,"s") + '</span>' : "")
    + (n > 1 && !S.selMode ? '<span class="phn">' + n + '</span>' : "")
    + (S.selMode
       ? '<button class="sel' + (sel?" on":"") + '" data-sel="' + p.id + '" onclick="toggleSel(\'' + p.id + '\')" '
         + 'aria-label="Auswählen">' + (sel ? ic("check","s") : "") + '</button>'
       : "")
    + '<' + tag + ' ' + open + '><div class="meta">'
      + '<div class="nm">' + esc(p.title || "Ohne Namen") + '</div>'
      + '<div class="pr">' + (p.price && p.price.amount != null ? money(p.price.amount, p.price.currency) : "kein Preis")
        + (p.price && p.price.amount != null ? '<small>' + money(priceIn(p,S.cfg.home), S.cfg.home) + '</small>' : "") + '</div>'
      + '<div class="bo">'
        + (lp ? '<span class="lampdot ' + lp.k + '"></span>' : "")
        + esc(s ? ([s.hall, s.booth].filter(Boolean).join(" ") || s.name) : "kein Stand")
        + (p.plan ? " · Container" : "") + '</div>'
    + '</div></' + tag + '></div>';
}
/* Langdruck auf eine Kachel startet den Auswahlmodus. */
function armLongPress(root){
  const grid = (root || document).querySelector(".grid");
  if(!grid) return;
  let timer = null, moved = false, id = null;
  const cancel = () => { clearTimeout(timer); timer = null; };
  grid.addEventListener("pointerdown", e => {
    const card = e.target.closest(".card");
    if(!card || S.selMode) return;
    id = card.dataset.id; moved = false;
    timer = setTimeout(() => {
      timer = null;
      if(moved || !id) return;
      S.selMode = true;
      S.sel.add(id);
      if(navigator.vibrate) navigator.vibrate(12);
      render();
    }, 420);
  }, {passive:true});
  grid.addEventListener("pointermove", () => { moved = true; cancel(); }, {passive:true});
  ["pointerup","pointercancel","pointerleave"].forEach(ev =>
    grid.addEventListener(ev, cancel, {passive:true}));
  grid.addEventListener("contextmenu", e => { if(S.selMode) e.preventDefault(); });
}
function toggleSelMode(){
  S.selMode = !S.selMode;
  if(!S.selMode) S.sel.clear();
  render();
}

/* ---------- Auswahlleiste ---------- */
function selBar(){
  if(!S.sel.size) { document.body.classList.remove("hassel"); return ""; }
  document.body.classList.add("hassel");
  return '<div class="selbar" id="selbar">'
    + '<span class="n">' + S.sel.size + '</span>'
    + '<div class="acts">'
      + '<button class="a" onclick="selectAllShown()">' + ic("check","s") + 'Alle</button>'
      + '<button class="a" onclick="go(\'/compare\')">' + ic("scales","s") + 'Vergleich</button>'
      + '<button class="a" onclick="bulkStatus()">' + ic("star","s") + 'Status</button>'
      + '<button class="a" onclick="bulkSupplier()">' + ic("building","s") + 'Stand</button>'
      + '<button class="a" onclick="bulkTag()">' + ic("plus","s") + 'Tag</button>'
      + '<button class="a" onclick="bulkPlan()">' + ic("box","s") + 'Container</button>'
      + '<button class="a dgr" onclick="bulkDelete()">' + ic("trash","s") + 'Löschen</button>'
    + '</div>'
    + '<button onclick="clearSel()" aria-label="Auswahl aufheben" style="color:var(--ink3);flex:none">' + ic("close") + '</button>'
    + '</div>';
}
function paintSelBar(){
  const old = document.getElementById("selbar");
  const html = selBar();
  if(old && !html){ old.remove(); return; }
  if(old && html){ old.querySelector(".n").textContent = S.sel.size; return; }
  if(html){
    const wrap = document.createElement("div");
    wrap.innerHTML = html;
    document.body.appendChild(wrap.firstChild);
  }
}

async function bulkStatus(){
  const r = await openSheet('<h3>Status für ' + S.sel.size + ' Produkte</h3>'
    + '<div class="chipset stat" style="margin-bottom:20px">'
    + Object.keys(STATUS).map(k => '<button data-v="' + k + '" onclick="closeSheet(\'' + k + '\')">'
        + ic(STATUS[k].i,"s") + STATUS[k].t + '</button>').join("")
    + '<button onclick="closeSheet(\'\')">Status entfernen</button></div>'
    + '<button class="btn" onclick="closeSheet(null)">Abbrechen</button>');
  if(r === null) return;
  for(const p of selProducts()){ p.status = r; p.updatedAt = Date.now(); await DB.put("products", p); }
  toast(S.sel.size + " Produkte aktualisiert");
  S.sel.clear(); render();
}
function bulkSupplier(){
  PENDING_GROUP = Array.from(S.sel);
  go("/pick-supplier");
}
async function bulkTag(){
  const r = await openSheet('<h3>Tag für ' + S.sel.size + ' Produkte</h3>'
    + '<div class="chipset" style="margin-bottom:20px">'
    + TAGS.map(t => '<button onclick="closeSheet(' + JSON.stringify(t).replace(/"/g,"&quot;") + ')">' + esc(t) + '</button>').join("")
    + '</div><button class="btn" onclick="closeSheet(null)">Abbrechen</button>');
  if(!r) return;
  for(const p of selProducts()){
    p.tags = p.tags || [];
    if(!p.tags.includes(r)) p.tags.push(r);
    await DB.put("products", p);
  }
  toast('Tag „' + r + '" gesetzt');
  S.sel.clear(); render();
}
async function bulkPlan(){
  const items = selProducts();
  const allIn = items.every(p => p.plan);
  for(const p of items){
    p.plan = !allIn;
    if(p.plan && !p.planQty) p.planQty = p.moq || 1;
    await DB.put("products", p);
  }
  toast(allIn ? "Aus dem Planer entfernt" : items.length + " im Container-Planer");
  S.sel.clear(); render();
}
async function bulkDelete(){
  const n = S.sel.size;
  if(!await askConfirm(n + " Produkte löschen?", "Mit allen Fotos. Das lässt sich nur aus einem Backup wiederherstellen.", "Löschen", true)) return;
  for(const p of selProducts()){
    for(const ph of (p.photoIds||[])) await DB.del("photos", ph);
    await DB.del("products", p.id);
  }
  S.products = S.products.filter(p => !S.sel.has(p.id));
  S.sel.clear();
  toast(n + " gelöscht");
  render();
}

/* ---------- Sortier- und Gruppier-Sheet ---------- */
async function openSortSheet(){
  const r = await openSheet('<h3>Sortieren und gruppieren</h3>'
    + '<div class="field"><label>Sortierung</label><div class="chipset">'
    + Object.keys(SORTS).map(k => '<button class="' + (S.cfg.sort===k?"on":"") + '" onclick="closeSheet(\'s:' + k + '\')">'
        + esc(SORTS[k].t) + '</button>').join("") + '</div></div>'
    + '<div class="field"><label>Gruppieren nach</label><div class="chipset">'
    + Object.keys(GROUPS).map(k => '<button class="' + (S.cfg.groupBy===k?"on":"") + '" onclick="closeSheet(\'g:' + k + '\')">'
        + esc(GROUPS[k]) + '</button>').join("") + '</div></div>'
    + '<div class="field"><label>Umfang</label><div class="chipset">'
    + '<button class="' + (!S.allFairs?"on":"") + '" onclick="closeSheet(\'f:0\')">Nur diese Messe</button>'
    + '<button class="' + (S.allFairs?"on":"") + '" onclick="closeSheet(\'f:1\')">Alle Messen</button>'
    + '</div></div>'
    + '<button class="btn" onclick="closeSheet(null)">Schließen</button>');
  if(!r) return;
  const [kind, val] = r.split(":");
  if(kind === "f"){ S.allFairs = val === "1"; render(); return; }
  if(kind === "s") S.cfg.sort = val; else S.cfg.groupBy = val;
  await saveCfg();
  render();
}

/* ---------- Vergleich arbeitet auf derselben Auswahl ---------- */
function viewCompare(){
  let items = selProducts();
  if(items.length > 4) items = items.slice(0,4);
  if(items.length < 2)
    return hdr("Vergleich",{back:true})
     + empty("scales","Mindestens zwei Produkte auswählen.","In der Produktliste lange auf eine Kachel drücken.")
     + '<div class="pad"><a class="cta ghost" href="#/products">' + ic("grid") + 'Zu den Produkten</a></div>';

  const rows = [
    {k:"RMB",       get:p => priceIn(p,"CNY"), fmt:v => money(v,"CNY"), best:"min"},
    {k:"EUR",       get:p => priceIn(p,"EUR"), fmt:v => money(v,"EUR"), best:"min"},
    {k:"USD",       get:p => priceIn(p,"USD"), fmt:v => money(v,"USD"), best:"min"},
    {k:"Preisart",  get:p => p.price && p.price.kind, fmt:v => v, best:null},
    {k:"MOQ",       get:p => p.moq, fmt:v => nf(v), best:"min"},
    {k:"Volumen",   get:p => itemCbm(p), fmt:v => nf(v,2) + " m³", best:"min"},
    {k:"Landed",    get:p => { const l = S.cfg.calcMode !== "off" ? landed(p) : null; return l ? l.eff : null; },
                    fmt:v => money(v,"EUR"), best:"min"},
    {k:"Faktor",    get:p => { const m = margin(p); return m ? m.factor : null; }, fmt:v => nf(v,2) + " ×", best:"max"},
    {k:"Design",    get:p => p.rate && p.rate.design,  fmt:v => v, best:"max"},
    {k:"Qualität",  get:p => p.rate && p.rate.quality, fmt:v => v, best:"max"},
    {k:"Gesamt",    get:p => score(p), fmt:v => nf(v,1), best:"max"},
    {k:"Lead Time", get:p => p.leadTime, fmt:v => v, best:null},
    {k:"Supplier",  get:p => { const s = supplierOf(p); return s && s.rating; }, fmt:v => v + " / 10", best:"max"}
  ].filter(r => items.some(p => { const v = r.get(p); return v != null && v !== ""; }));

  let h = hdr("Vergleich", {back:true, action:"clearSel()", actionLabel:"Leeren"});
  h += '<div class="cmpwrap" id="cmpw"><table class="cmp"><thead><tr><th></th>'
    + items.map(p => '<th>' + (p.photoIds && p.photoIds[0] ? '<img data-ph="' + p.photoIds[0] + '" alt="">' : "")
        + esc((p.title || "Ohne Namen").slice(0,16)) + '</th>').join("") + '</tr></thead><tbody>';

  let sameRows = 0;
  rows.forEach(r => {
    const vals = items.map(r.get);
    const shown = vals.map(v => v == null || v === "" ? "–" : String(r.fmt(v)));
    /* Eine Zeile, in der alle dasselbe sagen, entscheidet nichts — dort darf
       auch niemand als Gewinner markiert werden. */
    const allSame = shown.every(x => x === shown[0]);
    if(allSame) sameRows++;
    let bestV = null;
    if(!allSame && r.best){
      const nums = vals.filter(v => typeof v === "number" && !isNaN(v));
      if(nums.length > 1) bestV = r.best === "min" ? Math.min.apply(null,nums) : Math.max.apply(null,nums);
    }
    h += '<tr' + (allSame ? ' class="same"' : "") + '><td>' + r.k + '</td>'
      + vals.map((v,i) => '<td' + (bestV != null && v === bestV ? ' class="win"' : "") + '>'
        + esc(shown[i]) + '</td>').join("") + '</tr>';
  });
  h += '</tbody></table></div>';
  if(items.length > 2) h += '<div class="help pad" style="margin-top:10px">Seitlich wischen für alle Spalten.</div>';

  const withPrice = items.filter(p => priceIn(p,"EUR") != null);
  const cheapest = withPrice.slice().sort((a,b) => priceIn(a,"EUR") - priceIn(b,"EUR"))[0];
  const withScore = items.filter(p => score(p) != null);
  const bestQ = withScore.slice().sort((a,b) => (b.rate.quality||0) - (a.rate.quality||0))[0];
  const value = items.filter(p => score(p) != null && priceIn(p,"EUR"))
    .map(p => ({p, v: score(p) / priceIn(p,"EUR") * 100}))
    .sort((a,b) => b.v - a.v)[0];

  h += '<div class="verdict">'
    + (value    ? vrow("Best Value",   value.p.title || "Ohne Namen", nf(value.v,2) + " Punkte je 100 €") : "")
    + (cheapest ? vrow("Cheapest",     cheapest.title || "Ohne Namen", money(priceIn(cheapest,"EUR"),"EUR")) : "")
    + (bestQ    ? vrow("Best Quality", bestQ.title || "Ohne Namen", (bestQ.rate.quality||0) + " / 10") : "")
    + '</div>';
  if(sameRows)
    h += '<div class="help pad" style="margin-top:14px">' + sameRows
       + (sameRows === 1 ? " Zeile ist" : " Zeilen sind") + ' bei allen gleich und darum zurückgenommen.</div>';
  const pr = primer("compare",
    "Best Value = Gesamtnote ÷ Preis in Euro, mal 100. Kein Bauchgefühl, sondern eine Formel, die du nachrechnen kannst.",
    "Best Value = Note ÷ Preis × 100.");
  if(pr) h += '<div class="help pad" style="padding-bottom:28px;margin-top:8px">' + pr + '</div>';
  noteSeen("compare");
  return h + '<div style="height:16px"></div>';
}
</script>


<script>
"use strict";
/* ============================================================
   AUSBAU C — Container-Planer, Statistik, Anfrage an Lieferanten
   ============================================================ */

/* ---------- Container-Planer ---------- */
function viewContainer(){
  const t = planTotals();
  let h = hdr("Container", {back:true});

  h += '<div class="pad"><div class="seg" style="margin-bottom:22px">'
    + Object.keys(CONTAINERS).map(k => '<button class="' + (S.cfg.container===k?"on":"") + '" '
        + 'onclick="setContainer(\'' + k + '\')">' + CONTAINERS[k].t + '</button>').join("")
    + '</div>';

  if(!t.items.length){
    return h + '</div>' + empty("box","Noch nichts im Planer.",
      "Auf einem Produkt „Container“ antippen, oder in der Liste mehrere auswählen und zusammen hinzufügen.")
      + '<div class="pad"><a class="cta ghost" href="#/products">' + ic("grid") + 'Produkte auswählen</a></div>';
  }

  const pct = Math.min(100, t.pct);
  h += '<div class="fill">'
    + '<div class="track">'
      + '<div class="bar' + (t.pct > 100 ? " over" : "") + '" style="width:' + pct + '%"></div>'
      + '<span class="tick" style="left:25%"></span><span class="tick" style="left:50%"></span><span class="tick" style="left:75%"></span>'
    + '</div>'
    + '<div class="lg"><span>0</span><span>' + nf(t.vol,1) + ' / ' + t.cap + ' m³ · ' + nf(t.pct,0) + ' %</span><span>' + t.cap + ' m³</span></div>'
    + '</div>';

  h += '<div class="kpis">'
    + kpi("Stück gesamt", nf(t.pieces))
    + kpi("Positionen", nf(t.items.length))
    + kpi("Warenwert", money(t.goods,"EUR"))
    + (S.cfg.calcMode !== "off" ? kpi("Landed gesamt", money(t.eff,"EUR")) : kpi("in RMB", money(FX.conv(t.goods,"EUR","CNY"),"CNY")))
    + (S.cfg.calcMode === "sales" && t.sales ? kpi("VK-Potenzial", money(t.sales,"EUR")) : "")
    + (S.cfg.calcMode === "sales" && t.sales ? kpi("Rohertrag", money(t.sales - t.eff,"EUR")) : "")
    + '</div>';

  if(t.pct > 100)
    h += '<div class="note-w warn" style="margin:22px 0 0"><b>Über der Kapazität.</b> '
       + nf(t.vol - t.cap,1) + ' m³ zu viel — Menge reduzieren oder auf zwei Container aufteilen.</div>';
  else if(t.pct < 65 && t.vol > 0)
    h += '<div class="note-w warn" style="margin:22px 0 0"><b>Container nur zu ' + nf(t.pct,0) + ' % gefüllt.</b> '
       + 'Bei dieser Menge ist LCL oft günstiger als FCL — kostet pro m³ aber deutlich mehr und kippt die Kalkulation. '
       + nf(t.cap - t.vol,1) + ' m³ sind noch frei.</div>';
  if(t.unknown)
    h += '<div class="note-w" style="margin:16px 0 0"><b>' + t.unknown
       + (t.unknown === 1 ? ' Position ohne Maße' : ' Positionen ohne Maße') + '.</b> '
       + 'Die zählen im Füllstand nicht mit, der echte Bedarf liegt also höher.</div>';
  h += '</div>';

  h += '<div class="lbl-sec pad">Positionen</div><div class="pad"><div class="rows">'
    + t.items.map(p => {
        const v = itemCbm(p), q = planQty(p);
        return '<div class="row wrap">'
          + (p.photoIds && p.photoIds[0] ? '<img class="av" data-ph="' + p.photoIds[0] + '" alt="">' : ic("box"))
          + '<a class="t" href="#/p/' + p.id + '" style="color:var(--ink)">' + esc(p.title || "Ohne Namen")
          + '<small>' + (v ? nf(v,2) + ' m³ × ' + q + ' = ' + nf(v*q,2) + ' m³' : "Maße fehlen")
          + (priceIn(p,"EUR") != null ? ' · ' + money(priceIn(p,"EUR") * q, "EUR") : "") + '</small></a>'
          + '<span style="display:flex;align-items:center;gap:2px;flex:none">'
            + '<button onclick="planStep(\'' + p.id + '\',-1)" style="width:30px;height:30px;display:grid;place-items:center;color:var(--ink2)">–</button>'
            + '<span class="num" style="min-width:26px;text-align:center;font-size:14px">' + q + '</span>'
            + '<button onclick="planStep(\'' + p.id + '\',1)" style="width:30px;height:30px;display:grid;place-items:center;color:var(--ink2)">+</button>'
            + '<button onclick="togglePlan(\'' + p.id + '\')" style="width:30px;height:30px;display:grid;place-items:center;color:var(--ink3)">' + ic("close","s") + '</button>'
          + '</span></div>';
      }).join("")
    + '</div>'
    + '<div class="help" style="margin-top:16px;padding-bottom:24px">Kapazität ist nutzbares Ladevolumen, nicht Nennvolumen — '
      + 'Möbel lassen sich nicht lückenlos stapeln. Gerechnet wird mit dem Kartonmaß, sonst mit dem Produktmaß.</div></div>';
  return h;
}
function kpi(label, val){
  return '<div class="kpi"><span>' + esc(label) + '</span><b>' + val + '</b></div>';
}
async function setContainer(k){ S.cfg.container = k; await saveCfg(); render(); }
async function planStep(id, d){
  const p = S.products.find(x => x.id === id); if(!p) return;
  p.planQty = Math.max(1, planQty(p) + d);
  await DB.put("products", p);
  render();
}

/* ---------- Messe-Statistik ---------- */
function viewStats(){
  const ps = fairProducts();
  if(!ps.length) return hdr("Statistik",{back:true}) + empty("table","Noch keine Daten.","Erfasse ein paar Produkte, dann wird es hier interessant.");

  const withPrice = ps.filter(p => priceIn(p,"EUR") != null);
  const sumEur = withPrice.reduce((n,p) => n + priceIn(p,"EUR"), 0);
  const avg = withPrice.length ? sumEur / withPrice.length : null;
  const vol = ps.reduce((n,p) => n + (itemCbm(p) || 0), 0);
  const sups = new Set(ps.map(p => p.supplierId).filter(Boolean));
  const halls = new Set(ps.map(p => { const s = supplierOf(p); return s && s.hall; }).filter(Boolean));
  const rated = ps.filter(p => score(p) != null);
  const avgScore = rated.length ? rated.reduce((n,p) => n + score(p), 0) / rated.length : null;

  let h = hdr("Statistik", {back:true});
  h += '<div class="pad"><div class="statgrid">'
    + kpi("Produkte", nf(ps.length))
    + kpi("Lieferanten", nf(sups.size))
    + kpi("Hallen", nf(halls.size))
    + kpi("Gesamtvolumen", nf(vol,1) + '<small>m³</small>')
    + kpi("Warenwert", money(sumEur,"EUR"))
    + kpi("Ø Preis", avg != null ? money(avg,"EUR") : "–")
    + (avgScore != null ? kpi("Ø Bewertung", nf(avgScore,1) + '<small>/ 10</small>') : "")
    + kpi("Ohne Preis", nf(ps.length - withPrice.length))
    + '</div></div>';

  h += bars("Nach Kategorie", ps, p => p.category || "Ohne Kategorie");
  h += bars("Nach Status", ps, p => p.status ? STATUS[p.status].t : "Ohne Status");
  h += bars("Nach Halle", ps, p => { const s = supplierOf(p); return s && s.hall ? "Hall " + s.hall : "Ohne Halle"; });
  h += bars("Top-Lieferanten", ps, p => { const s = supplierOf(p); return s ? s.name : "Ohne Lieferant"; }, 6);
  h += bars("Erfasst pro Tag", ps, p => dstamp(p.createdAt).slice(0,10), 8, true);

  /* Preisspanne */
  if(withPrice.length > 2){
    const sorted = withPrice.map(p => priceIn(p,"EUR")).sort((a,b) => a - b);
    const med = sorted[Math.floor(sorted.length/2)];
    h += '<div class="lbl-sec pad">Preisspanne</div><div class="pad"><div class="calc">'
      + '<div class="r"><span>Günstigstes</span><b>' + money(sorted[0],"EUR") + '</b></div>'
      + '<div class="r"><span>Median</span><b>' + money(med,"EUR") + '</b></div>'
      + '<div class="r"><span>Teuerstes</span><b>' + money(sorted[sorted.length-1],"EUR") + '</b></div>'
      + '</div></div>';
  }
  h += '<div style="height:24px"></div>';
  return h;
}
function bars(title, list, keyFn, limit, chrono){
  const m = new Map();
  list.forEach(p => { const k = keyFn(p); m.set(k, (m.get(k) || 0) + 1); });
  let entries = Array.from(m.entries());
  if(chrono) entries.sort((a,b) => a[0].localeCompare(b[0]));
  else entries.sort((a,b) => b[1] - a[1]);
  if(limit) entries = entries.slice(0, limit);
  if(entries.length < 2) return "";
  const max = Math.max.apply(null, entries.map(e => e[1]));
  return '<div class="lbl-sec pad">' + esc(title) + '</div><div class="pad"><div class="blist">'
    + entries.map(([k,n]) =>
        '<div class="brow"><span class="lb">' + esc(k) + '</span><span class="vl">' + n + '</span>'
        + '<span class="tr"><i style="width:' + (n/max*100) + '%"></i></span></div>').join("")
    + '</div></div>';
}

/* ---------- Anfrage an einen Lieferanten ---------- */
function rfqText(sup, items){
  const L = [];
  L.push("Inquiry — " + (sup.name || "Supplier"));
  if(sup.booth || sup.hall) L.push("Booth: " + [sup.hall && "Hall " + sup.hall, sup.booth].filter(Boolean).join(" / "));
  if(sup.contact) L.push("Attn: " + sup.contact);
  L.push("Date: " + dstamp().slice(0,10));
  L.push("");
  L.push("We met at " + ((fair() && fair().name) || "the fair") + " and would like to request a quotation for:");
  L.push("");
  items.forEach((p,i) => {
    const parts = [];
    if(p.price && p.price.amount != null)
      parts.push("quoted " + CUR[p.price.currency].sym + " " + nf(p.price.amount) + (p.price.kind && p.price.kind !== "unbekannt" ? " " + p.price.kind : ""));
    if(p.moq) parts.push("MOQ " + p.moq);
    if(p.dims && p.dims.l) parts.push(p.dims.l + "x" + p.dims.w + "x" + p.dims.h + " cm");
    if(p.material) parts.push(p.material);
    L.push((i+1) + ". " + (p.title || "Item " + (i+1)) + (parts.length ? " — " + parts.join(", ") : ""));
  });
  L.push("");
  L.push("Please confirm for each item:");
  L.push("- FOB price and port, and price at MOQ / 100 pcs / 500 pcs");
  L.push("- Carton dimensions and CBM per piece, pcs per carton");
  L.push("- Production lead time and sample lead time");
  L.push("- Sample cost and whether it is deductible from the first order");
  L.push("- Certificates available (CE, EN 12520/12521, REACH, FSC)");
  L.push("- OEM / custom fabric, finish and logo options");
  L.push("- Payment terms");
  L.push("");
  L.push("Thank you.");
  return L.join("\n");
}
function viewRfq(sid){
  const sup = S.suppliers.find(x => x.id === sid);
  if(!sup) return hdr("Nicht gefunden",{back:true});
  const items = productsOf(sid);
  if(!items.length) return hdr("Anfrage",{back:true}) + empty("file","Für diesen Lieferanten ist nichts erfasst.");

  const sent = daysSince(sup.rfqSentAt);
  let h = hdr("Anfrage", {back:true});
  h += '<div class="pad" style="display:flex;gap:9px;margin-bottom:14px">'
    + '<button class="btn pri" onclick="shareRfq(\'' + sid + '\')">' + ic("arrow","s") + 'Teilen</button>'
    + '<button class="btn" onclick="window.print()">' + ic("file","s") + 'Drucken</button>'
    + '<button class="btn sm" onclick="copyRfq(\'' + sid + '\')">' + ic("card","s") + '</button>'
    + '</div>'
    + '<div class="pad" style="margin-bottom:20px">'
      + (sup.rfqSentAt
         ? '<div class="bkstate' + (sent >= 5 && !sup.repliedAt ? " due" : "") + '" style="margin:0;justify-content:flex-start">'
           + ic(sup.repliedAt ? "check" : "alert","s")
           + '<span>' + (sup.repliedAt ? "Antwort erhalten"
               : "Vor " + sent + (sent === 1 ? " Tag" : " Tagen") + " gesendet"
                 + (sent >= 5 ? " — Zeit zum Nachfassen" : "")) + '</span></div>'
         : '<button class="btn" style="width:100%" onclick="markSent(\'' + sid + '\')">'
           + ic("check","s") + 'Anderweitig gesendet — vermerken</button>')
    + '</div>';
  h += '<div class="pad rfq">'
    + '<div style="font-size:19px;font-weight:600;letter-spacing:-.02em;margin-bottom:4px">' + esc(sup.name) + '</div>'
    + '<div class="help" style="margin:0 0 20px">'
      + esc([sup.hall && "Hall " + sup.hall, sup.booth, sup.contact, sup.wechat && "WeChat " + sup.wechat]
            .filter(Boolean).join(" · ") || "keine Standdaten") + '</div>'
    + '<div class="rows">'
    + items.map((p,i) => '<div class="row wrap">'
        + (p.photoIds && p.photoIds[0] ? '<img class="av" data-ph="' + p.photoIds[0] + '" alt="">' : ic("box"))
        + '<span class="t">' + (i+1) + '. ' + esc(p.title || "Ohne Namen")
        + '<small>' + esc([
            p.price && p.price.amount != null ? money(p.price.amount, p.price.currency) + (p.price.kind && p.price.kind !== "unbekannt" ? " " + p.price.kind : "") : null,
            p.moq ? "MOQ " + p.moq : null,
            p.dims && p.dims.l ? p.dims.l + "×" + p.dims.w + "×" + p.dims.h + " cm" : null,
            p.material
          ].filter(Boolean).join(" · ") || "keine Angaben") + '</small></span></div>').join("")
    + '</div>'
    + '<div class="lbl-sec">Fragen im Text</div>'
    + '<pre style="white-space:pre-wrap;font:12.5px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;'
      + 'color:var(--ink2);background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:15px;overflow-x:auto">'
      + esc(rfqText(sup, items)) + '</pre>'
    + '<div class="help" style="padding-bottom:24px">Der Text ist auf Englisch — so kannst du ihn direkt per WeChat oder Mail '
      + 'an den Stand schicken. Am selben Abend verschickt bekommt er die besten Antwortquoten.</div>'
    + '</div>';
  return h;
}
async function shareRfq(sid){
  const sup = S.suppliers.find(x => x.id === sid);
  const txt = rfqText(sup, productsOf(sid));
  if(navigator.share){
    try{
      await navigator.share({ title:"Inquiry — " + sup.name, text:txt });
      await markSent(sid);            // ab jetzt läuft die Uhr im Nachfassen
      return;
    }catch(e){ if(e && e.name === "AbortError") return; }
  }
  await copyRfq(sid);
  await markSent(sid);
}
async function copyRfq(sid){
  const sup = S.suppliers.find(x => x.id === sid);
  const txt = rfqText(sup, productsOf(sid));
  try{
    await navigator.clipboard.writeText(txt);
    toast("Text kopiert");
  }catch(e){
    const ta = document.createElement("textarea");
    ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("Text kopiert"); }
    catch(_){ toast("Kopieren nicht möglich"); }
    ta.remove();
  }
}
</script>


<script>
"use strict";
/* ============================================================
   AUSBAU D — Startseite, Einstellungen, Lieferant, Erststart, Router
   ============================================================ */

/* ---------- Toast mit Aktion (Rückgängig) ---------- */
function toastAction(msg, label, fn, ms){
  const old = document.querySelector(".toast"); if(old) old.remove();
  const t = document.createElement("div");
  t.className = "toast";
  t.style.display = "flex"; t.style.alignItems = "center"; t.style.gap = "14px";
  t.innerHTML = '<span>' + esc(msg) + '</span>';
  const b = document.createElement("button");
  b.textContent = label;
  b.style.cssText = "color:var(--ink);font-weight:600;flex:none;border-bottom:1px solid var(--ln2)";
  b.onclick = () => { t.remove(); fn(); };
  t.appendChild(b);
  document.body.appendChild(t);
  setTimeout(() => {
    if(!t.parentNode) return;
    t.classList.add("out");
    setTimeout(() => { if(t.parentNode) t.remove(); }, 200);
  }, ms || 6000);
}

/* ---------- Löschen mit Rückgängig ---------- */
async function delProduct(id){
  const p = S.products.find(x => x.id === id);
  if(!p) return;
  if(!await askConfirm("Produkt löschen?", "Das Produkt und seine Fotos werden entfernt.", "Löschen", true)) return;
  const photos = [];
  for(const ph of (p.photoIds||[])){
    const rec = await DB.get("photos", ph);
    if(rec) photos.push(rec);
  }
  const audios = [];
  for(const aid of (p.voiceIds||[])){
    const rec = await DB.get("audio", aid);
    if(rec) audios.push(rec);
  }
  const snapshot = JSON.parse(JSON.stringify(p));
  await DB.del("products", id);
  for(const ph of (p.photoIds||[])) await DB.del("photos", ph);
  for(const aid of (p.voiceIds||[])) await DB.del("audio", aid);
  S.products = S.products.filter(x => x.id !== id);
  S.sel.delete(id);
  go("/products");
  toastAction("Gelöscht", "Rückgängig", async () => {
    for(const rec of photos) await DB.put("photos", rec);
    for(const rec of audios) await DB.put("audio", rec);
    await DB.put("products", snapshot);
    S.products.unshift(snapshot);
    S.products.sort((a,b) => b.createdAt - a.createdAt);
    toast("Wiederhergestellt");
    render();
  });
}

/* ---------- Netz- und Update-Zustand ---------- */
/* iOS verschiebt bei geoeffneter Tastatur nicht das Layout, sondern nur das
   sichtbare Fenster. Ohne diese Korrektur landet eine unten fixierte Leiste
   hinter der Tastatur oder klebt mitten im Bild. */
function trackKeyboard(){
  const vv = window.visualViewport;
  if(!vv) return;
  let raf = 0;
  const apply = () => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const kb = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
      document.documentElement.style.setProperty("--kb", kb + "px");
      document.body.classList.toggle("kbopen", kb > 80);
    });
  };
  vv.addEventListener("resize", apply);
  vv.addEventListener("scroll", apply);
  window.addEventListener("orientationchange", () => setTimeout(apply, 300));
  apply();
}
trackKeyboard();

window.addEventListener("online",  () => { S.online = true;  render(); });
window.addEventListener("offline", () => { S.online = false; render(); });

  h += '<details class="more"' + (hasContact ? " open" : "") + '>'

      + F("E-Mail","email") + F("Website","website") + F("Ort","city","Foshan, Guangdong")

    + '</div></div>'

function supPhoto(id, kind){
  const s = S.suppliers.find(x => x.id === id); if(!s) return;
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*"; inp.setAttribute("capture","environment"); inp.style.display = "none";
  document.body.appendChild(inp);
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; inp.remove();
    if(!f) return;
    toast("Wird verarbeitet…", 1200);
    try{
      const pid = await addPhoto(f, kind);
      s[kind === "card" ? "cardPhotoId" : "boothPhotoId"] = pid;
      await DB.put("suppliers", s);
      render();
    }catch(e){ toast(humanError(e) || "Foto konnte nicht gelesen werden"); }
  };
  inp.click();
}
async function openSupPhoto(id, kind){
  const s = S.suppliers.find(x => x.id === id); if(!s) return;
  const key = kind === "card" ? "cardPhotoId" : "boothPhotoId";
  const r = await openSheet('<h3>' + (kind === "card" ? "Visitenkarte" : "Standfoto") + '</h3>'
    + '<div style="display:flex;gap:9px">'
    + '<button class="btn" onclick="closeSheet(\'new\')">Neu aufnehmen</button>'
    + '<button class="btn dgr" onclick="closeSheet(\'del\')">Löschen</button></div>');
  if(r === "new") return supPhoto(id, kind);
  if(r === "del"){
    await DB.del("photos", s[key]);
    s[key] = null;
    await DB.put("suppliers", s);
    render();
  }
}

/* ---------- Start ---------- */
(async function start(){
  try{
    await loadAll();
  }catch(e){
    app.innerHTML = empty("alert","Datenbank lässt sich nicht öffnen.",
      "Im privaten Modus von Safari funktioniert die App nicht. Öffne sie in einem normalen Fenster oder über das Homescreen-Symbol.");
    return;
  }
  if(navigator.storage && navigator.storage.persist){
    try{ await navigator.storage.persist(); }catch(e){}
  }
  if(!location.hash) location.hash = "#/";
  render();

  if(!S.cfg.onboarded && !S.fairs.length) setTimeout(onboard, 450);

  /* Fuellstand beim Start und danach alle zehn Minuten. */
  checkStorage();
  setInterval(checkStorage, 600000);
  document.addEventListener("visibilitychange", () => { if(!document.hidden) checkStorage(); });

  if(navigator.onLine && !S.cfg.ratesManual &&
     (!S.cfg.ratesTs || Date.now() - S.cfg.ratesTs > 12*3600*1000)){
    FX.refresh().then(ok => { if(ok) render(); });
  }

  if("serviceWorker" in navigator && location.protocol.startsWith("http")){
    try{
      const reg = await navigator.serviceWorker.register("sw.js");
      if(reg.waiting){ S.swWaiting = reg.waiting; render(); }
      reg.addEventListener("updatefound", () => {
        const nw = reg.installing;
        if(!nw) return;
        nw.addEventListener("statechange", () => {
          if(nw.state === "installed" && navigator.serviceWorker.controller){
            S.swWaiting = nw;
            render();
          }
        });
      });
    }catch(e){ /* ohne Service Worker läuft die App online trotzdem */ }
  }
})();
</script>


<script>
"use strict";
/* ============================================================
   AUSBAU F — Sprachnotizen, Scan-Rollen, Teilen, Messewechsel
   ============================================================ */

/* ---------- Aufnahme ---------- */
let REC = null;
function recMime(){
  if(typeof MediaRecorder === "undefined") return null;
  for(const m of ["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg"]){
    try{ if(MediaRecorder.isTypeSupported(m)) return m; }catch(e){}
  }
  return "";
}
async function startRec(onDone){
  if(REC) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === "undefined"){
    toast("Aufnahme wird von diesem Browser nicht unterstützt");
    return;
  }
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ toast("Kein Zugriff auf das Mikrofon"); return; }

  const mime = recMime();
  let mr;
  try{ mr = mime ? new MediaRecorder(stream, {mimeType:mime}) : new MediaRecorder(stream); }
  catch(e){ mr = new MediaRecorder(stream); }
  const chunks = [];
  mr.ondataavailable = ev => { if(ev.data && ev.data.size) chunks.push(ev.data); };

  const el = document.createElement("div");
  el.className = "rec";
  el.innerHTML = '<span class="dot"></span>'
    + '<span class="t"><b>Sprachnotiz läuft</b><small id="rect">0:00</small></span>'
    + '<button class="cancel" onclick="cancelRec()">Verwerfen</button>'
    + '<button class="stop" onclick="stopRec()">Fertig</button>';
  document.body.appendChild(el);

  const t0 = Date.now();
  const tick = setInterval(() => {
    const sec = Math.floor((Date.now() - t0)/1000);
    const n = document.getElementById("rect");
    if(n) n.textContent = Math.floor(sec/60) + ":" + String(sec % 60).padStart(2,"0");
    if(sec >= 180) stopRec();          // harte Grenze, sonst laufen Aufnahmen versehentlich ewig
  }, 250);

  REC = { mr, stream, chunks, el, tick, t0, onDone, cancelled:false };
  mr.onstop = async () => {
    clearInterval(tick);
    stream.getTracks().forEach(t => t.stop());
    if(el.parentNode) el.remove();
    const cancelled = REC && REC.cancelled;
    const dur = Math.round((Date.now() - t0)/1000);
    const cb = REC && REC.onDone;
    REC = null;
    if(cancelled || !chunks.length) return;
    const blob = new Blob(chunks, {type: chunks[0].type || mime || "audio/mp4"});
    const rec = { id:uid(), blob, dur, createdAt:Date.now() };
    await DB.put("audio", rec);
    if(cb) cb(rec.id);
  };
  mr.start();
}
function stopRec(){ if(REC && REC.mr.state !== "inactive") REC.mr.stop(); }
function cancelRec(){ if(REC){ REC.cancelled = true; stopRec(); } }

async function recordFor(pid){
  await startRec(async aid => {
    if(pid === "draft"){
      S.draft.voiceIds = S.draft.voiceIds || [];
      S.draft.voiceIds.push(aid);
      toast("Sprachnotiz gespeichert");
      render();
      return;
    }
    const p = S.products.find(x => x.id === pid);
    if(!p){ await DB.del("audio", aid); return; }
    p.voiceIds = p.voiceIds || [];
    p.voiceIds.push(aid);
    p.updatedAt = Date.now();
    await DB.put("products", p);
    toast("Sprachnotiz gespeichert");
    render();
  });
}
async function playAudio(aid, btn){
  const rec = await DB.get("audio", aid);
  if(!rec){ toast("Aufnahme nicht gefunden"); return; }
  if(playAudio._a){ playAudio._a.pause(); if(playAudio._b) playAudio._b.innerHTML = ic("arrow","s"); }
  const url = URL.createObjectURL(rec.blob);
  const a = new Audio(url);
  playAudio._a = a; playAudio._b = btn;
  btn.innerHTML = ic("close","s");
  a.onended = () => { btn.innerHTML = ic("arrow","s"); URL.revokeObjectURL(url); playAudio._a = null; };
  a.play().catch(() => { toast("Wiedergabe nicht möglich"); btn.innerHTML = ic("arrow","s"); });
}
async function delAudio(pid, aid){
  if(!await askConfirm("Sprachnotiz löschen?","Die Aufnahme wird entfernt.","Löschen",true)) return;
  const p = S.products.find(x => x.id === pid);
  if(p){ p.voiceIds = (p.voiceIds||[]).filter(x => x !== aid); await DB.put("products", p); }
  await DB.del("audio", aid);
  render();
}
function audioBlock(p){
  const ids = p.voiceIds || [];
  return '<div class="sec"><h3>Sprachnotizen</h3>'
    + (ids.length
       ? ids.map((aid,i) => '<div class="arow">'
           + '<button class="pl" onclick="playAudio(\'' + aid + '\',this)" aria-label="Abspielen">' + ic("arrow","s") + '</button>'
           + '<span class="meta">Notiz ' + (i+1) + '<small>angetippt zum Abspielen</small></span>'
           + '<button onclick="delAudio(\'' + p.id + '\',\'' + aid + '\')" style="color:var(--ink3)">' + ic("close","s") + '</button>'
           + '</div>').join("")
       : '<div class="help" style="margin:0 0 14px">Hände voll, laut am Stand, keine Lust zu tippen — '
         + 'dann sprich es einfach ein und schreib es abends ab.</div>')
    + '<button class="btn" style="width:100%;margin-top:12px" onclick="recordFor(\'' + p.id + '\')">'
      + ic("message","s") + 'Aufnehmen</button></div>';
}

/* ---------- Produkt teilen ---------- */
function productText(p){
  const s = supplierOf(p), l = S.cfg.calcMode !== "off" ? landed(p) : null;
  const L = [p.title || "Ohne Namen"];
  if(p.price && p.price.amount != null)
    L.push(money(p.price.amount, p.price.currency)
      + (p.price.kind && p.price.kind !== "unbekannt" ? " " + p.price.kind : "")
      + "  ≈ " + money(priceIn(p,"EUR"),"EUR") + " / " + money(priceIn(p,"USD"),"USD"));
  if(s) L.push(s.name + (s.booth ? " · Hall " + (s.hall||"?") + " / " + s.booth : ""));
  if(p.moq) L.push("MOQ " + p.moq);
  if(p.dims && p.dims.l) L.push("Maße " + p.dims.l + "×" + p.dims.w + "×" + p.dims.h + " cm");
  if(itemCbm(p)) L.push("Volumen " + nf(itemCbm(p),2) + " m³");
  if(p.material) L.push(p.material);
  if(p.leadTime) L.push("Lead Time " + p.leadTime);
  if(l) L.push("Landed ca. " + money(l.eff,"EUR"));
  if(score(p) != null) L.push("Bewertung " + nf(score(p),1) + "/10");
  if(p.note) L.push("", p.note);
  return L.join("\n");
}
async function shareProduct(id){
  const p = S.products.find(x => x.id === id); if(!p) return;
  const txt = productText(p);
  if(navigator.share){
    try{
      let files;
      if(p.photoIds && p.photoIds[0] && navigator.canShare){
        const rec = await DB.get("photos", p.photoIds[0]);
        if(rec){
          const f = new File([rec.blob], (p.title || "produkt").replace(/[^\w-]+/g,"_") + ".jpg", {type:"image/jpeg"});
          if(navigator.canShare({files:[f]})) files = [f];
        }
      }
      await navigator.share(files ? {title:p.title || "Produkt", text:txt, files} : {title:p.title || "Produkt", text:txt});
      return;
    }catch(e){ if(e && e.name === "AbortError") return; }
  }
  try{ await navigator.clipboard.writeText(txt); toast("In die Zwischenablage kopiert"); }
  catch(e){ toast("Teilen wird hier nicht unterstützt"); }
}

/* ---------- Umfang der Produktliste ----------
   Der Schalter wirkt nur auf Liste, Suche und Vergleich, nicht auf die
   Kennzahlen der Startseite — sonst zählt man plötzlich fremde Messen mit. */
function listBase(){
  if(S.allFairs) return S.products;
  return fairProducts();
}
function filtered(){
  const f = S.filter;
  const q = f.q.trim().toLowerCase();
  return listBase().filter(p => {
    if(f.status && p.status !== f.status) return false;
    if(f.cat && p.category !== f.cat) return false;
    if(f.supplier && p.supplierId !== f.supplier) return false;
    if(f.tag && !(p.tags||[]).includes(f.tag)) return false;
    if(f.stage && p.stage !== f.stage) return false;
    if(f.hall){ const s = supplierOf(p); if(!s || s.hall !== f.hall) return false; }
    if(q){
      const s = supplierOf(p);
      const hay = [p.title, p.sku, p.category, p.material, p.variants, p.note, (p.tags||[]).join(" "),
                   p.price && p.price.kind, s && s.name, s && s.booth, s && s.hall,
                   s && s.contact, s && s.city].filter(Boolean).join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

<script>
"use strict";
/* ============================================================
   AUSBAU I — Preisschild einfügen, Backup zusammenführen
   ============================================================ */

/* ---------- Zahlen aus fremden Schreibweisen ---------- */
function parseNum(raw){
  let t = String(raw == null ? "" : raw).replace(/\s/g, "");
  if(!t) return null;
  const hasDot = t.indexOf(".") >= 0, hasCom = t.indexOf(",") >= 0;
  if(hasDot && hasCom){
    // Der hintere Trenner ist das Dezimalzeichen: 4.800,50 wie auch 4,800.50
    const last = Math.max(t.lastIndexOf("."), t.lastIndexOf(","));
    const dec = t[last], thou = dec === "." ? "," : ".";
    t = t.split(thou).join("").replace(dec, ".");
  }else if(hasDot || hasCom){
    const sep = hasDot ? "." : ",";
    const parts = t.split(sep);
    // 4.800 und 4,800 sind Tausender, 320.50 ist eine Dezimalzahl
    const groups = parts.slice(1).every(x => x.length === 3);
    t = (parts.length > 1 && groups && parts[0].length <= 3)
      ? parts.join("")
      : parts.join(".");
  }
  const n = parseFloat(t);
  return isNaN(n) ? null : n;
}

/* ---------- Preisschild als Ganzes lesen ---------- */
function parseTag(text){
  let t = " " + String(text == null ? "" : text).replace(/ /g, " ") + " ";
  const out = {};

  // Maße zuerst, sonst wird die erste Kantenlänge als Preis gelesen
  const dm = t.match(/(\d[\d.,]*)\s*[x×*╳]\s*(\d[\d.,]*)\s*[x×*╳]\s*(\d[\d.,]*)\s*(mm|cm|m)?/i);
  if(dm){
    let [l, w, h] = [parseNum(dm[1]), parseNum(dm[2]), parseNum(dm[3])];
    const unit = (dm[4] || "").toLowerCase();
    const biggest = Math.max(l, w, h);
    let f = 1;
    if(unit === "mm") f = 0.1;
    else if(unit === "m") f = 100;
    else if(!unit && biggest > 400) f = 0.1;      // ohne Einheit sind grosse Werte Millimeter
    const r = v => Math.round(v * f * 10) / 10;
    out.dims = { l:r(l), w:r(w), h:r(h) };
    out.dimUnit = unit || (f === 0.1 ? "mm (angenommen)" : "cm (angenommen)");
    t = t.replace(dm[0], " ");
  }

  // MOQ
  const mq = t.match(/(?:MOQ|Min\.?\s*Order|Mindestabnahme)\s*[:：]?\s*(\d[\d.,]*)/i)
          || t.match(/(?:最小起订量|起订量|起订)\s*[:：]?\s*(\d[\d.,]*)/)
          || t.match(/(\d[\d.,]*)\s*(?:pcs?|sets?|stk)\s*(?:\/\s*)?(?:MOQ|min)/i);
  if(mq){
    const n = parseNum(mq[1]);
    if(n != null && n > 0){ out.moq = Math.round(n); t = t.replace(mq[0], " "); }
  }

  // Preisbasis
  if(/\/\s*(set|套)/i.test(t)) out.basis = "set";
  else if(/\/\s*(carton|ctn|箱)/i.test(t)) out.basis = "carton";
  else if(/\/\s*(pc|pcs|piece|stk|个|件)/i.test(t)) out.basis = "piece";

  // Preis: bevorzugt eine Zahl direkt an einem Währungszeichen
  let pm = t.match(/(?:[¥￥$€]|RMB|CNY|USD|EUR|US\$)\s*(\d[\d.,]*)/i)
        || t.match(/(\d[\d.,]*)\s*(?:元|RMB|CNY|USD|EUR|[¥￥$€])/i);
  if(!pm){
    // sonst die groesste freistehende Zahl im Rest
    const all = (t.match(/\d[\d.,]*/g) || []).map(parseNum).filter(n => n != null && n > 0);
    if(all.length) pm = [null, String(Math.max.apply(null, all))];
  }
  if(pm){
    const n = parseNum(pm[1]);
    if(n != null && n > 0) out.price = n;
  }

  // Währung
  if(/[¥￥]|RMB|CNY|人民币|元/i.test(text)) out.currency = "CNY";
  else if(/US\$|\bUSD\b|\$/i.test(text)) out.currency = "USD";
  else if(/€|\bEUR\b/i.test(text)) out.currency = "EUR";

  // Artikelnummer
  const sk = String(text).match(/(?:Art\.?(?:\s*Nr\.?)?|Model|Item|型号|货号)\s*[:：#]?\s*([A-Z0-9][A-Z0-9\-\/]{2,})/i);
  if(sk) out.sku = sk[1];

  return out;
}

/* ---------- Text aus der Zwischenablage übernehmen ----------
   iOS erkennt Text in Fotos selbst (Live Text). Man markiert ihn im Bild,
   kopiert, und hier wird herausgelesen, was verwertbar ist. */
async function readClipboard(){
  try{
    if(navigator.clipboard && navigator.clipboard.readText){
      const t = await navigator.clipboard.readText();
      if(t && t.trim()) return t;
    }
  }catch(e){ /* verweigert oder nicht unterstützt */ }
  return null;
}
function tagSummary(f){
  const L = [];
  if(f.price != null) L.push("Preis " + money(f.price, f.currency || "CNY"));
  const dv = v => Number.isInteger(v) ? nf(v) : nf(v,1);
  if(f.dims) L.push("Maße " + dv(f.dims.l) + " × " + dv(f.dims.w) + " × " + dv(f.dims.h) + " cm");
  if(f.moq != null) L.push("MOQ " + nf(f.moq));
  if(f.basis) L.push(BASIS[f.basis]);
  if(f.sku) L.push("Art. " + f.sku);
  return L;
}
async function smartPaste(targetId){
  let text = await readClipboard();
  if(text == null){
    const r = await openSheet('<h3>Text einfügen</h3>'
      + '<div class="help" style="margin:0 0 14px">Safari lässt mich die Zwischenablage nicht von selbst lesen. '
      + 'Feld antippen und einfügen — der Rest geht automatisch.</div>'
      + '<div class="field"><textarea class="inp" data-k="t" placeholder="¥ 3.980 / set&#10;MOQ 10&#10;1800 × 900 × 760 mm"></textarea></div>'
      + '<div style="display:flex;gap:9px">'
      + '<button class="btn" onclick="closeSheet(null)">Abbrechen</button>'
      + '<button class="btn pri" onclick="submitSheet()">Lesen</button></div>');
    if(!r || !r.t) return;
    text = r.t;
  }
  const f = parseTag(text);
  const lines = tagSummary(f);
  if(!lines.length){ toast("Nichts Verwertbares im Text gefunden"); return; }

  const ok = await openSheet('<h3>Gefunden</h3>'
    + '<div class="calc" style="margin-bottom:20px">'
    + lines.map(l => '<div class="r"><span>' + esc(l) + '</span></div>').join("")
    + '</div>'
    + (f.dimUnit && f.dimUnit.indexOf("angenommen") >= 0
       ? '<div class="note-w warn" style="margin:0 0 18px"><b>Einheit geraten:</b> '
         + esc(f.dimUnit) + '. Auf der Produktseite nachprüfen.</div>' : "")
    + '<div style="display:flex;gap:9px">'
    + '<button class="btn" onclick="closeSheet(null)">Verwerfen</button>'
    + '<button class="btn pri" onclick="closeSheet(1)">Übernehmen</button></div>');
  if(!ok) return;

  const t = targetId === "draft" ? S.draft : S.products.find(x => x.id === targetId);
  if(!t) return;
  t.price = t.price || { amount:null, currency:"CNY", kind:"", basis:"piece" };
  if(f.price != null) t.price.amount = f.price;
  if(f.currency) t.price.currency = f.currency;
  if(f.basis) t.price.basis = f.basis;
  if(f.moq != null) t.moq = f.moq;
  if(f.sku && !t.sku) t.sku = f.sku;
  if(f.dims) t.dims = { l:f.dims.l, w:f.dims.w, h:f.dims.h };
  if(targetId !== "draft"){ t.cbm = cbm(t.dims); await DB.put("products", t); }
  toast("Übernommen: " + lines.length + (lines.length === 1 ? " Angabe" : " Angaben"));
  render();
}

/* ---------- Backup: ersetzen oder zusammenführen ---------- */
async function readBackup(file){
  let dump = null, photos = {}, audios = {}, roles = {};
  if(/\.zip$/i.test(file.name) || file.type === "application/zip"){
    const entries = await ZIP.read(file);
    if(!entries["data.json"]) throw new Error("data.json fehlt im ZIP");
    dump = JSON.parse(new TextDecoder().decode(entries["data.json"]));
    Object.keys(entries).forEach(n => {
      const m = n.match(/^photos\/(.+)\.jpg$/);
      if(m) photos[m[1]] = entries[n];
      const a = n.match(/^audio\/(.+)\.(m4a|webm)$/);
      if(a) audios[a[1]] = { data: entries[n], ext: a[2] };
    });
    if(entries["photo-roles.json"]){
      try{ roles = JSON.parse(new TextDecoder().decode(entries["photo-roles.json"])); }catch(e){}
    }
  }else{
    dump = JSON.parse(await file.text());
  }
  if(!dump || dump.app !== "SOURCE") throw new Error("Kein SOURCE-Backup");
  return { dump, photos, audios, roles };
}
const stamp = o => o && (o.updatedAt || o.createdAt || 0);

async function doImport(file){
  let data;
  try{ data = await readBackup(file); }
  catch(e){ toast("Backup nicht lesbar: " + e.message); return; }
  const { dump, photos, audios, roles } = data;

  const inP = (dump.products || []).length, inS = (dump.suppliers || []).length;
  const known = new Set(S.products.map(p => p.id));
  const fresh = (dump.products || []).filter(p => !known.has(p.id)).length;

  const mode = await openSheet('<h3>Backup einspielen</h3>'
    + '<div class="calc" style="margin-bottom:18px">'
    + '<div class="r"><span>Im Backup</span><b>' + inP + ' Produkte · ' + inS + ' Lieferanten</b></div>'
    + '<div class="r"><span>Erstellt</span><b>' + esc(dump.exportedAt ? dstamp(dump.exportedAt) : "unbekannt") + '</b></div>'
    + '<div class="r"><span>Auf diesem Gerät</span><b>' + S.products.length + ' Produkte</b></div>'
    + '<div class="r sum"><span>Davon neu</span><b>' + fresh + '</b></div>'
    + '</div>'
    + '<div style="display:flex;flex-direction:column;gap:9px">'
    + '<button class="btn pri" onclick="closeSheet(\'merge\')">' + ic("plus","s") + 'Zusammenführen</button>'
    + '<button class="btn dgr" onclick="closeSheet(\'replace\')">' + ic("alert","s") + 'Alles ersetzen</button>'
    + '<button class="btn" onclick="closeSheet(null)">Abbrechen</button></div>'
    + '<div class="help">Zusammenführen behält bei gleicher Kennung die neuere Fassung und lässt '
    + 'alles stehen, was nur auf diesem Gerät liegt. Ersetzen wirft den aktuellen Bestand weg.</div>');
  if(!mode) return;

  if(mode === "replace"){
    if(!await askConfirm("Wirklich ersetzen?",
        "Alle " + S.products.length + " Produkte auf diesem Gerät werden gelöscht und durch das Backup ersetzt.",
        "Ersetzen", true)) return;
    for(const st of DB.stores) await DB.clear(st);
    S.photoUrls.forEach(u => URL.revokeObjectURL(u));
    S.photoUrls.clear();
  }

  toast("Wird eingespielt…", 4000);
  let added = 0, updated = 0, kept = 0;

  for(const f of (dump.fairs || [])){
    const old = await DB.get("fairs", f.id);
    if(!old){ await DB.put("fairs", f); }
    else if(stamp(f) > stamp(old)) await DB.put("fairs", f);
  }
  for(const sup of (dump.suppliers || [])){
    const old = await DB.get("suppliers", sup.id);
    if(!old) await DB.put("suppliers", sup);
    else if(stamp(sup) > stamp(old)) await DB.put("suppliers", sup);
  }
  for(const pr of (dump.products || [])){
    const old = await DB.get("products", pr.id);
    if(!old){ await DB.put("products", pr); added++; }
    else if(stamp(pr) > stamp(old)){ await DB.put("products", pr); updated++; }
    else kept++;
  }
  if(mode === "replace" && dump.settings)
    await DB.put("settings", Object.assign({}, dump.settings, {id:"app"}));

  const ids = Object.keys(photos);
  for(const id of ids){
    if(await DB.get("photos", id)) continue;      // Bilder sind unveraenderlich
    const blob = new Blob([photos[id]], {type:"image/jpeg"});
    let thumb = blob;
    try{ thumb = await shrink(blob, 400, .7); }catch(e){}
    await DB.put("photos", { id, blob, thumb, role: roles[id] || "product", takenAt:Date.now() });
  }
  const aids = Object.keys(audios);
  for(const aid of aids){
    if(await DB.get("audio", aid)) continue;
    const a = audios[aid];
    await DB.put("audio", { id:aid, blob:new Blob([a.data], {type: a.ext === "webm" ? "audio/webm" : "audio/mp4"}),
                            dur:0, createdAt:Date.now() });
  }

  await loadAll();
  S.sel.clear(); S.selMode = false;
  const msg = mode === "replace"
    ? "Ersetzt: " + added + " Produkte, " + ids.length + " Fotos"
    : added + " neu, " + updated + " aktualisiert, " + kept + " unverändert";
  toast(msg, 5000);
  go("/");
}
function impPick(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".zip,.json,application/zip,application/json"; inp.style.display = "none";
  document.body.appendChild(inp);
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; inp.remove();
    if(!f) return;
    try{ await doImport(f); }catch(e){ toast("Import fehlgeschlagen: " + e.message); }
  };
  inp.click();
}
</script>

    ".verdictline b{color:var(--ink);font-weight:600}"
  ].join("\n");
  document.head.appendChild(st);
